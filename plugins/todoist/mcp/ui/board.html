<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Todoist</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --surface: #ffffff;
    --surface-2: #f3f3f3;
    --surface-3: #e8e8e8;
    --text: #0d0d0d;
    --text-2: #5d5d5d;
    --text-3: #8f8f8f;
    --border: rgba(0,0,0,.10);
    --border-strong: rgba(0,0,0,.16);
    --border-subtle: rgba(0,0,0,.06);
    --accent: #339cff;
    --accent-soft: rgba(51,156,255,.14);
    --danger: #d92d20;
    --primary-bg: #0d0d0d;
    --primary-text: #ffffff;
    --hover: rgba(0,0,0,.045);
    --shadow-modal: 0 24px 64px rgba(0,0,0,.22);
    --radius-xs: 4px;
    --radius-sm: 6px;
    --radius-md: 8px;
    --radius-lg: 10px;
    --radius-xl: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #171717;
      --surface: #212121;
      --surface-2: #303030;
      --surface-3: #414141;
      --text: #ffffff;
      --text-2: #cdcdcd;
      --text-3: #afafaf;
      --border: rgba(255,255,255,.15);
      --border-strong: rgba(255,255,255,.20);
      --border-subtle: rgba(255,255,255,.06);
      --accent: #339cff;
      --accent-soft: rgba(51,156,255,.18);
      --danger: #ff6b5f;
      --primary-bg: #ffffff;
      --primary-text: #0d0d0d;
      --hover: rgba(255,255,255,.07);
      --shadow-modal: 0 24px 64px rgba(0,0,0,.55);
    }
  }
  html.dark {
    --bg: #171717; --surface: #212121; --surface-2: #303030; --surface-3: #414141;
    --text: #ffffff; --text-2: #cdcdcd; --text-3: #afafaf;
    --border: rgba(255,255,255,.15); --border-strong: rgba(255,255,255,.20); --border-subtle: rgba(255,255,255,.06);
    --accent: #339cff; --accent-soft: rgba(51,156,255,.18); --danger: #ff6b5f;
    --primary-bg: #ffffff; --primary-text: #0d0d0d; --hover: rgba(255,255,255,.07);
    --shadow-modal: 0 24px 64px rgba(0,0,0,.55);
  }
  html.light {
    --bg: #ffffff; --surface: #ffffff; --surface-2: #f3f3f3; --surface-3: #e8e8e8;
    --text: #0d0d0d; --text-2: #5d5d5d; --text-3: #8f8f8f;
    --border: rgba(0,0,0,.10); --border-strong: rgba(0,0,0,.16); --border-subtle: rgba(0,0,0,.06);
    --accent: #339cff; --accent-soft: rgba(51,156,255,.14); --danger: #d92d20;
    --primary-bg: #0d0d0d; --primary-text: #ffffff; --hover: rgba(0,0,0,.045);
    --shadow-modal: 0 24px 64px rgba(0,0,0,.22);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { min-height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "MiSans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 13px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    font-feature-settings: "tnum" 1;
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; border: 0; background: none; padding: 0; }
  .app { max-width: 1080px; margin: 0 auto; padding: 28px 28px 20px; display: flex; flex-direction: column; min-height: 100vh; }
  #content { flex: 1; display: flex; flex-direction: column; }

  .header { padding-bottom: 14px; border-bottom: 1px solid var(--border-subtle); }
  .title-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .title-row h1 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: -.01em; }
  .header-actions { display: flex; align-items: center; gap: 10px; }
  .conn { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text-2); white-space: nowrap; }
  .conn i { width: 6px; height: 6px; border-radius: 50%; background: var(--text-3); }
  .conn.ok i { background: var(--accent); }
  .conn.local i { background: #f5a623; }
  .summary { margin-top: 3px; font-size: 11.5px; color: var(--text-2); }
  .icon-btn {
    width: 26px; height: 26px; border-radius: var(--radius-sm);
    display: grid; place-items: center; color: var(--text-2);
    transition: background .14s ease;
  }
  .icon-btn:hover { background: var(--hover); }
  .icon-btn svg { width: 14px; height: 14px; }
  .icon-btn.spin svg { animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .banner {
    display: flex; align-items: flex-start; gap: 7px;
    margin-top: 12px; padding: 8px 10px;
    border: 1px solid var(--border-subtle); border-radius: var(--radius-md);
    background: var(--surface-2); color: var(--text-2);
    font-size: 11.5px; line-height: 1.5;
  }
  .banner svg { width: 13px; height: 13px; flex: 0 0 auto; margin-top: 1px; color: var(--text-3); }

  .progress { padding: 14px 0 2px; }
  .progress-row { display: flex; align-items: baseline; justify-content: space-between; font-size: 11.5px; color: var(--text-2); }
  .progress-row b { color: var(--text); font-weight: 600; }
  .progress-bar { height: 3px; margin-top: 8px; border-radius: 999px; background: var(--surface-3); overflow: hidden; }
  .progress-bar i {
    display: block; height: 100%; width: 0; border-radius: inherit;
    background: var(--accent); transition: width .45s cubic-bezier(.2,.8,.2,1);
  }  .project-row { position: relative; display: flex; align-items: center; gap: 6px; margin-top: 10px; }
  .project-select {
    flex: 1; min-width: 0; height: 30px; padding: 0 8px;
    border-radius: var(--radius-md); border: 1px solid var(--border);
    background: var(--surface); color: var(--text); font-size: 12px; outline: none;
  }
  .project-select:focus { border-color: var(--accent); }
  .popover {
    position: absolute; top: 36px; left: 0; right: 0; z-index: 30;
    display: flex; gap: 6px; padding: 8px;
    border: 1px solid var(--border); border-radius: var(--radius-md);
    background: var(--surface); box-shadow: var(--shadow-modal);
  }
  .popover input {
    flex: 1; min-width: 0; height: 28px; padding: 0 8px;
    border: 1px solid var(--border); border-radius: var(--radius-sm);
    background: var(--surface-2); color: var(--text); font-size: 12px; outline: none;
  }
  .popover input:focus { border-color: var(--accent); }
  .mini { height: 28px; padding: 0 10px; border-radius: var(--radius-sm); font-size: 12px; font-weight: 500; }
  .search-row {
    display: flex; align-items: center; gap: 8px; height: 34px; margin-top: 18px;
    padding: 0 10px; border: 1px solid var(--border); border-radius: var(--radius-md);
    background: var(--surface);
  }
  .search-row:focus-within { border-color: var(--accent); }
  .search-row svg { width: 14px; height: 14px; color: var(--text-3); flex: 0 0 auto; }
  .search-row input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-size: 12.5px; }
  .search-row input::placeholder { color: var(--text-3); }
  .filters { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .chip {
    height: 26px; padding: 0 10px; border-radius: 999px;
    background: var(--surface-2); color: var(--text-2); font-size: 11px;
    transition: background .14s ease, color .14s ease;
  }
  .chip:hover { background: var(--surface-3); }
  .chip.active { background: var(--primary-bg); color: var(--primary-text); }
  .labels { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
  .label-chip {
    height: 17px; padding: 0 5px; border-radius: 4px;
    background: var(--surface-2); color: var(--text-2); font-size: 10px; line-height: 17px;
  }
  .drag-handle {
    flex: 0 0 auto; width: 16px; height: 22px;
    display: grid; place-items: center; color: var(--text-3);
    opacity: 0; cursor: grab; transition: opacity .14s ease;
  }
  .drag-handle svg { width: 12px; height: 12px; }
  .step:hover .drag-handle, .task:hover .drag-handle { opacity: 1; }
  @media (hover: none) { .drag-handle { opacity: .6; } }
  .step.dragging, .task.dragging { opacity: .45; }
  .drop-target { box-shadow: inset 0 2px 0 var(--accent); }
  .no-results { flex: 1; display: flex; align-items: center; justify-content: center; padding: 36px 0; text-align: center; color: var(--text-3); font-size: 12px; }
  .edit-select {
    width: 100%; height: 34px; padding: 0 8px; border-radius: var(--radius-md);
    border: 1px solid var(--border); background: var(--surface-2);
    color: var(--text); font-size: 13px; outline: none;
  }
  .edit-select:focus { border-color: var(--accent); }
  @keyframes fade-up {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: none; }
  }
  @keyframes pop {
    0% { transform: scale(1); }
    45% { transform: scale(1.16); }
    100% { transform: scale(1); }
  }
  @keyframes flash-row {
    0% { background: var(--accent-soft); }
    100% { background: transparent; }
  }
  @keyframes line-grow {
    from { transform: scaleY(0); }
    to { transform: scaleY(1); }
  }
  .header, .progress { animation: fade-up .26s cubic-bezier(.2,.8,.2,1) both; }
  .section.animate { animation: fade-up .28s cubic-bezier(.2,.8,.2,1) both; }
  .section.animate .step, .section.animate .task {
    animation: fade-up .24s cubic-bezier(.2,.8,.2,1) both;
    animation-delay: calc(var(--i, 0) * 28ms);
  }
  .section.animate .step::before {
    transform-origin: top;
    animation: line-grow .34s ease both;
    animation-delay: calc(var(--i, 0) * 28ms);
  }
  .dot.pop, .check.pop { animation: pop .3s cubic-bezier(.2,.8,.2,1); }
  .step.flash, .task.flash { animation: flash-row .55s ease; }
  .dot:active, .check:active, .icon-btn:active, .modal-close:active, .send-btn:active, .text-btn:active {
    transform: scale(.94);
  }
  .section { margin-top: 22px; }
  .section-head { display: flex; align-items: center; gap: 8px; margin-bottom: 2px; }
  .section-head h2 { margin: 0; font-size: 12px; font-weight: 600; color: var(--text-2); }
  .section-head .count { font-size: 11px; color: var(--text-3); font-variant-numeric: tabular-nums; }
  .section-head .line { flex: 1; height: 1px; background: var(--border-subtle); }

  .steps { position: relative; }
  .step { position: relative; display: flex; align-items: flex-start; gap: 10px; padding: 10px 0; }
  .step + .step { border-top: 1px solid var(--border-subtle); }
  .step::before {
    content: ""; position: absolute; left: 8px; top: 0; bottom: 0;
    width: 1px; background: var(--border);
  }
  .step:first-child::before { top: 21px; }
  .step:last-child::before { bottom: calc(100% - 21px); }
  .step:only-child::before { display: none; }
  .dot {
    position: relative; z-index: 1; flex: 0 0 auto;
    width: 17px; height: 17px; margin-top: 3px; border-radius: 50%;
    border: 1.5px solid var(--border-strong); background: var(--bg);
    display: grid; place-items: center; color: transparent;
    transition: all .16s ease;
  }
  .dot svg { width: 10px; height: 10px; stroke-width: 2.6; }
  .dot:hover { border-color: var(--accent); }
  .step.done .dot { background: var(--text); border-color: var(--text); color: var(--bg); }
  .step.active .dot { border-color: var(--accent); }
  .step.active .dot::after { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }

  .row-main { flex: 1; min-width: 0; padding-top: 1px; }
  .title-line { display: flex; align-items: baseline; gap: 6px; }
  .pdot { width: 5px; height: 5px; border-radius: 50%; flex: 0 0 auto; transform: translateY(-1px); }
  .pdot.p1 { background: #e5484d; }
  .pdot.p2 { background: #f5a623; }
  .pdot.p3 { background: #339cff; }
  .row-title { font-size: 13px; line-height: 1.45; font-weight: 450; word-break: break-word; cursor: text; }
  .step.done .row-title { color: var(--text-3); text-decoration: line-through; text-decoration-thickness: 1px; }
  .row-meta { display: flex; align-items: center; gap: 5px; margin-top: 2px; font-size: 11px; color: var(--text-3); flex-wrap: wrap; }
  .meta-sep { width: 2px; height: 2px; border-radius: 50%; background: currentColor; opacity: .6; }
  .row-more {
    flex: 0 0 auto; width: 22px; height: 22px; border-radius: var(--radius-xs);
    display: grid; place-items: center; color: var(--text-3);
    opacity: 0; transition: opacity .14s ease, background .14s ease;
  }
  .row-more svg { width: 14px; height: 14px; }
  .step:hover .row-more, .task:hover .row-more, .row-more:focus-visible { opacity: 1; }
  .row-more:hover { background: var(--hover); }
  @media (hover: none) { .row-more { opacity: 1; } }

  .task { display: flex; align-items: flex-start; gap: 10px; padding: 10px 0; }
  .task + .task { border-top: 1px solid var(--border-subtle); }
  .check {
    flex: 0 0 auto; width: 17px; height: 17px; margin-top: 3px;
    border-radius: 4px; border: 1.5px solid var(--border-strong);
    background: transparent; display: grid; place-items: center;
    color: transparent; transition: all .16s ease;
  }
  .check svg { width: 11px; height: 11px; stroke-width: 2.6; }
  .check:hover { border-color: var(--accent); }
  .task.done .check { background: var(--text); border-color: var(--text); color: var(--bg); }
  .task.done .row-title { color: var(--text-3); text-decoration: line-through; text-decoration-thickness: 1px; }

  .empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 0; text-align: center; }
  .empty h3 { margin: 0 0 4px; font-size: 13px; font-weight: 600; }
  .empty p { margin: 0; font-size: 11.5px; color: var(--text-3); }
  .empty-cta {
    margin-top: 14px; height: 30px; padding: 0 12px;
    border-radius: var(--radius-md); background: var(--primary-bg);
    color: var(--primary-text); font-size: 12px; font-weight: 500;
  }  .dock { position: static; margin-top: 18px; padding: 0 0 env(safe-area-inset-bottom); background: none; }
  .dock-inner { max-width: none; margin: 0; }
  .dock-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 0 2px 7px; }
  .hint { font-size: 11px; color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .text-btn { font-size: 11.5px; color: var(--text-2); padding: 2px 0; transition: color .14s ease; }
  .text-btn:hover { color: var(--text); }
  .text-btn[disabled] { opacity: .4; }
  .quick-add { margin-top: 14px; }
  .quick-add-meta { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 8px; padding: 0 2px; }
  .composer {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 6px 6px 12px;
    border: 1px solid var(--border); border-radius: var(--radius-xl);
    background: var(--surface); box-shadow: 0 1px 2px rgba(0,0,0,.03);
  }
  .composer:focus-within { border-color: var(--border-strong); }
  .composer input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-size: 13px; padding: 5px 0; }
  .composer input::placeholder { color: var(--text-3); }
  .send-btn {
    flex: 0 0 auto; width: 30px; height: 30px; border-radius: var(--radius-md);
    display: grid; place-items: center;
    background: var(--primary-bg); color: var(--primary-text);
    transition: opacity .15s ease, transform .15s ease;
  }
  .send-btn:hover { opacity: .85; }
  .send-btn:active { transform: scale(.95); }
  .send-btn[disabled] { opacity: .4; }
  .send-btn svg { width: 15px; height: 15px; }

  .backdrop {
    position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.32);
    opacity: 0; visibility: hidden; transition: opacity .18s ease, visibility .18s ease;
  }
  .backdrop.show { opacity: 1; visibility: visible; }
  .modal {
    position: fixed; left: 50%; top: 50%; z-index: 41;
    width: min(400px, calc(100vw - 32px));
    transform: translate(-50%, -48%); opacity: 0; visibility: hidden;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-xl); box-shadow: var(--shadow-modal);
    padding: 16px;
    transition: opacity .18s ease, transform .18s ease, visibility .18s ease;
  }
  .modal.show { opacity: 1; visibility: visible; transform: translate(-50%, -50%); }
  @media (max-width: 520px) {
    .modal {
      top: auto; bottom: 0; left: 0; transform: none; width: 100%;
      border-radius: var(--radius-xl) var(--radius-xl) 0 0;
      padding-bottom: calc(16px + env(safe-area-inset-bottom));
    }
    .modal.show { transform: none; }
  }
  .modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .modal-head h2 { margin: 0; font-size: 14px; font-weight: 600; }
  .modal-close { width: 24px; height: 24px; border-radius: var(--radius-xs); display: grid; place-items: center; color: var(--text-2); }
  .modal-close:hover { background: var(--hover); }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 11.5px; color: var(--text-2); margin-bottom: 5px; }
  .field input {
    width: 100%; height: 34px; padding: 0 10px;
    border-radius: var(--radius-md); border: 1px solid var(--border);
    background: var(--surface-2); color: var(--text); font-size: 13px; outline: none;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  .field input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
  .seg { display: flex; gap: 4px; }
  .seg button {
    flex: 1; height: 30px; border-radius: var(--radius-sm);
    background: var(--surface-2); color: var(--text-2);
    font-size: 11.5px; font-weight: 500;
    transition: background .14s ease, color .14s ease;
  }
  .seg button:hover { background: var(--surface-3); }
  .seg button.active { background: var(--primary-bg); color: var(--primary-text); }
  .modal-actions { display: flex; gap: 8px; margin-top: 14px; }
  .modal-actions button { flex: 1; height: 34px; border-radius: var(--radius-md); font-size: 13px; font-weight: 500; transition: opacity .15s ease; }
  .modal-actions button:hover { opacity: .85; }
  .primary { background: var(--primary-bg); color: var(--primary-text); }
  .danger-ghost { background: transparent; color: var(--danger); border: 1px solid var(--border); }
  .confirm {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    margin-top: 10px; padding: 8px 10px; border-radius: var(--radius-md);
    background: var(--surface-2); color: var(--danger); font-size: 11.5px;
  }
  .confirm-actions { display: flex; gap: 6px; }
  .confirm button {
    height: 26px; padding: 0 10px; border-radius: var(--radius-sm);
    background: var(--surface); color: var(--text); font-size: 11.5px; border: 1px solid var(--border);
  }
  .confirm .solid { background: var(--danger); color: #fff; border-color: transparent; }
  .hidden { display: none !important; }

  .toast {
    position: fixed; left: 50%; bottom: 24px; z-index: 30;
    transform: translate(-50%, 8px); max-width: min(84vw, 380px);
    padding: 8px 12px; border-radius: var(--radius-md);
    background: var(--text); color: var(--bg); font-size: 11.5px; line-height: 1.4;
    opacity: 0; pointer-events: none;
    transition: opacity .18s ease, transform .18s ease;
    box-shadow: 0 8px 24px rgba(0,0,0,.18);
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .toast.error { background: var(--danger); color: #fff; }
  .footnote { margin-top: 32px; text-align: center; font-size: 10.5px; color: var(--text-3); }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .001ms !important;
      animation-delay: 0ms !important;
      transition-duration: .001ms !important;
    }
  }
</style>
</head><body>
<div class="app">
  <header class="header">
    <div class="title-row">
      <h1>Todoist</h1>
      <div class="header-actions">
        <span id="modePill" class="conn"><i></i><span id="modeText">连接中</span></span>
        <button id="refreshBtn" class="icon-btn" type="button" title="刷新" aria-label="刷新">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-.6 3"/><path d="M20 4v7h-7"/></svg>
        </button>
      </div>
    </div>
    <div class="summary" id="summaryText">正在读取…</div>
    <div class="project-row">
      <select id="projectSelect" class="project-select" aria-label="项目"></select>
      <button id="newProjectBtn" class="icon-btn" type="button" title="新建项目" aria-label="新建项目">+</button>
      <div id="projectPopover" class="popover hidden">
        <input id="projectName" placeholder="项目名称" maxlength="80" autocomplete="off" />
        <button id="projectCreate" class="primary mini" type="button">创建</button>
      </div>
    </div>
  </header>

  <div id="banner"></div>

  <section class="progress" aria-label="完成进度">
    <div class="progress-row">
      <span><b id="doneNum">0</b> / <b id="totalNum">0</b> 已完成</span>
      <span id="percentText">0%</span>
    </div>
    <div class="progress-bar"><i id="barFill"></i></div>
  </section>

  <div class="search-row">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>

<div id="toast" class="toast" role="status" aria-live="polite"></div><script>
(() => {
  "use strict";

  const $ = (id) => document.getElementById(id);
  const state = { data: null, connected: false, demo: false, busy: false, timer: null, firstRender: true, filter: "all", query: "" };

  const previewTheme = new URLSearchParams(window.location.search).get("theme");
  if (previewTheme === "dark" || previewTheme === "light") {
    document.documentElement.classList.add(previewTheme);
  }

  const bridge = (() => {
    let seq = 0;
    const pending = new Map();
    const listeners = new Map();

    window.addEventListener("message", (event) => {
      if (event.source === window) return;
      const data = event.data;
      if (!data || typeof data !== "object") return;
      if (data.id != null && pending.has(data.id)) {
        const item = pending.get(data.id);
        pending.delete(data.id);
        clearTimeout(item.timer);
        if (data.error) item.reject(new Error(data.error.message || "请求失败"));
        else item.resolve(data.result);
        return;
      }
      if (typeof data.method === "string") {
        const handler = listeners.get(data.method);
        if (handler) handler(data.params || {});
      }
    });

    function request(method, params, timeout = 15000) {
      const id = ++seq;
      return new Promise((resolve, reject) => {
        const timer = setTimeout(() => { pending.delete(id); reject(new Error("timeout")); }, timeout);
        pending.set(id, { resolve, reject, timer });
        try {
          window.parent.postMessage({ jsonrpc: "2.0", id, method, params }, "*");
        } catch (error) {
          clearTimeout(timer);
          pending.delete(id);
          reject(error);
        }
      });
    }

    function notify(method, params) {
      window.parent.postMessage({ jsonrpc: "2.0", method, params }, "*");
    }

    async function connect() {
      if (window.parent === window) throw new Error("not-embedded");
      const params = {
        appCapabilities: { availableDisplayModes: ["inline", "fullscreen"] },
        appInfo: { name: "Todoist", version: "0.5.0" },
        protocolVersion: "2026-01-26",
      };
      let result;
      try {
        result = await request("ui/initialize", params, 4000);
      } catch (error) {
        result = await request("ui/initialize", params, 4000);
      }
      notify("ui/notifications/initialized", {});
      applyHostContext(result && result.hostContext ? result.hostContext : {});
      return result;
    }

    async function callTool(name, args = {}) {
      return request("tools/call", { name, arguments: args }, 25000);
    }

    function on(method, handler) { listeners.set(method, handler); }
    return { connect, callTool, on };
  })();

  function applyHostContext(context) {
    const theme = context && context.theme;
    if (theme === "dark") {
      document.documentElement.classList.remove("light");
      document.documentElement.classList.add("dark");
    } else if (theme === "light") {
      document.documentElement.classList.remove("dark");
      document.documentElement.classList.add("light");
    }
  }
  bridge.on("ui/notifications/host-context-changed", applyHostContext);

  function unwrap(result) {
    if (result && result.structuredContent) return result.structuredContent;
    const text = result && Array.isArray(result.content)
      ? (result.content.find((item) => item && item.type === "text") || {}).text
      : null;
    if (!text) return null;
    try { return JSON.parse(text); } catch { return { ok: true, message: text }; }
  }

  function toast(message, kind) {
    const el = $("toast");
    el.textContent = message;
    el.className = "toast show" + (kind === "error" ? " error" : "");
    clearTimeout(toast.timer);
    toast.timer = setTimeout(() => { el.className = "toast"; }, 2400);
  }

  function setMode(mode) {
    const pill = $("modePill");
    const text = $("modeText");
    pill.classList.remove("ok", "local");
    if (mode === "todoist") {
      pill.classList.add("ok");
      text.textContent = "Todoist";
    } else if (mode === "local") {
      pill.classList.add("local");
      text.textContent = "本地";
    } else {
      text.textContent = "连接中";
    }
  }

  function renderBanner() {
    const el = $("banner");
    if (!state.demo) { el.innerHTML = ""; return; }
    el.innerHTML =
      '<div class="banner"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 9v4"/><path d="M12 17h.01"/><circle cx="12" cy="12" r="9"/></svg><div>当前是演示数据。在 Codex 侧边栏里打开会读取真实待办。</div></div>';
  }

  function animateValue(el, to, suffix) {
    const target = Number(to) || 0;
    const from = Number(el.dataset.value || 0);
    el.dataset.value = String(target);
    if (from === target || window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
      el.textContent = target + suffix;
      return;
    }
    const start = performance.now();
    const duration = 380;
    const step = (now) => {
      const progress = Math.min(1, (now - start) / duration);
      const eased = 1 - Math.pow(1 - progress, 3);
      el.textContent = Math.round(from + (target - from) * eased) + suffix;
      if (progress < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }

  function renderStats(stats) {
    animateValue($("doneNum"), stats.completed || 0, "");
    animateValue($("totalNum"), stats.total || 0, "");
    animateValue($("percentText"), stats.percent || 0, "%");
    $("summaryText").textContent = (stats.active || 0) + " 项待办 · " + (stats.completed || 0) + " 项已完成";
    requestAnimationFrame(() => { $("barFill").style.width = (stats.percent || 0) + "%"; });
  }  function svgCheck() {
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.2 4.2L19 7"/></svg>';
  }

  function moreButton(task) {
    const btn = document.createElement("button");
    btn.className = "row-more";
    btn.type = "button";
    btn.setAttribute("aria-label", "编辑任务");
    btn.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>';
    btn.addEventListener("click", (event) => { event.stopPropagation(); openEditor(task); });
    return btn;
  }

  function metaRow(parts) {
    const meta = document.createElement("div");
    meta.className = "row-meta";
    parts.filter(Boolean).forEach((text, index) => {
      if (index > 0) {
        const sep = document.createElement("span");
        sep.className = "meta-sep";
        meta.appendChild(sep);
      }
      const span = document.createElement("span");
      span.textContent = text;
      meta.appendChild(span);
    });
    return meta;
  }

  function titleLine(task) {
    const line = document.createElement("div");
    line.className = "title-line";
    if (task.priority >= 1 && task.priority <= 3) {
      const dot = document.createElement("span");
      dot.className = "pdot p" + task.priority;
      line.appendChild(dot);
    }
    const title = document.createElement("div");
    title.className = "row-title";
    title.textContent = task.content || "(无标题)";
    title.addEventListener("click", () => openEditor(task));
    line.appendChild(title);
    return line;
  }

  function labelsNode(task) {
    const labels = Array.isArray(task.labels) ? task.labels : [];
    if (labels.length === 0) return null;
    const wrap = document.createElement("div");
    wrap.className = "labels";
    labels.forEach((label) => {
      const chip = document.createElement("span");
      chip.className = "label-chip";
      chip.textContent = label;
      wrap.appendChild(chip);
    });
    return wrap;
  }

  function dragHandle() {
    const grip = document.createElement("span");
    grip.className = "drag-handle";
    grip.title = "拖动排序";
    grip.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="1.4"/><circle cx="15" cy="6" r="1.4"/><circle cx="9" cy="12" r="1.4"/><circle cx="15" cy="12" r="1.4"/><circle cx="9" cy="18" r="1.4"/><circle cx="15" cy="18" r="1.4"/></svg>';
    return grip;
  }

  function stepNode(task, index) {
    const step = document.createElement("div");
    const status = task.checked ? "done" : task.planStatus === "inProgress" ? "active" : "";
    step.className = "step" + (status ? " " + status : "");
    step.style.setProperty("--i", String(index || 0));
    step.dataset.id = String(task.id);
    step.draggable = true;

    const dot = document.createElement("button");
    dot.className = "dot";
    dot.type = "button";
    dot.setAttribute("aria-label", task.checked ? "标记为未完成" : "标记为完成");
    dot.innerHTML = svgCheck();
    dot.addEventListener("click", () => toggleTask(task));
    step.appendChild(dot);

    const main = document.createElement("div");
    main.className = "row-main";
    main.appendChild(titleLine(task));
    main.appendChild(metaRow([
      task.checked ? "已完成" : task.planStatus === "inProgress" ? "进行中" : "待开始",
      task.due,
    ]));
    const stepLabels = labelsNode(task);
    if (stepLabels) main.appendChild(stepLabels);
    step.appendChild(main);
    step.appendChild(dragHandle());
    step.appendChild(moreButton(task));
    if (task._justToggled) {
      step.classList.add("flash");
      dot.classList.add("pop");
      task._justToggled = false;
    }
    return step;
  }

  function taskNode(task, index) {
    const row = document.createElement("div");
    row.className = "task" + (task.checked ? " done" : "");
    row.style.setProperty("--i", String(index || 0));
    row.dataset.id = String(task.id);
    row.draggable = true;

    const check = document.createElement("button");
    check.className = "check";
    check.type = "button";
    check.setAttribute("aria-label", task.checked ? "标记为未完成" : "标记为完成");
    check.innerHTML = svgCheck();
    check.addEventListener("click", () => toggleTask(task));
    row.appendChild(check);

    const main = document.createElement("div");
    main.className = "row-main";
    main.appendChild(titleLine(task));
    if (task.due) main.appendChild(metaRow([task.due]));
    const taskLabels = labelsNode(task);
    if (taskLabels) main.appendChild(taskLabels);
    row.appendChild(main);
    row.appendChild(dragHandle());
    row.appendChild(moreButton(task));
    if (task._justToggled) {
      row.classList.add("flash");
      check.classList.add("pop");
      task._justToggled = false;
    }
    return row;
  }

  function sectionNode(label, count, note) {
    const section = document.createElement("section");
    section.className = "section";
    const head = document.createElement("div");
    head.className = "section-head";
    const h2 = document.createElement("h2");
    h2.textContent = label;
    const cnt = document.createElement("span");
    cnt.className = "count";
    cnt.textContent = String(count);
    head.append(h2, cnt);
    if (note) {
      const noteEl = document.createElement("span");
      noteEl.className = "count";
      noteEl.textContent = "· " + note;
      head.appendChild(noteEl);
    }
    const line = document.createElement("span");
    line.className = "line";
    head.appendChild(line);
    section.appendChild(head);
    return section;
  }

  function applyFilters(tasks) {
    const query = state.query.trim().toLowerCase();
    const today = new Date().toISOString().slice(0, 10);
    return tasks.filter((task) => {
      if (query) {
        const haystack = (task.content + " " + (task.labels || []).join(" ")).toLowerCase();
        if (!haystack.includes(query)) return false;
      }
      switch (state.filter) {
        case "active": return !task.checked;
        case "done": return task.checked;
        case "today": return task.dueDate === today;
        case "plan": return task.source === "plan";
        case "manual": return task.source !== "plan";
        default: return true;
      }
    });
  }

  function renderList(data, animate) {
    const content = $("content");
    content.innerHTML = "";
    const tasks = Array.isArray(data.tasks) ? data.tasks : [];
    const visible = applyFilters(tasks);
    const plan = visible.filter((task) => task.source === "plan");
    const manual = visible.filter((task) => task.source !== "plan");

    if (tasks.length > 0 && visible.length === 0) {
      const empty = document.createElement("div");
      empty.className = "no-results";
      empty.textContent = "没有匹配的任务";
      content.appendChild(empty);
      return;
    }

    if (tasks.length === 0) {
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.innerHTML = "<h3>还没有任务</h3><p>在上方输入一条任务，或者在对话里生成计划。</p><button id=\"emptyAdd\" class=\"empty-cta\" type=\"button\">添加第一条任务</button>";
      const emptyAdd = empty.querySelector("#emptyAdd");
      if (emptyAdd) emptyAdd.addEventListener("click", () => { $("newTask").focus(); });
      content.appendChild(empty);
      return;
    }

    if (plan.length) {
      const groups = new Map();
      plan.forEach((task) => {
        const key = task.sessionId || "default";
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push(task);
      });
      const plans = data.lastPlans && typeof data.lastPlans === "object" ? data.lastPlans : {};
      const ordered = Array.from(groups.entries()).sort((a, b) => {
        const ta = plans[a[0]] && plans[a[0]].updatedAt ? plans[a[0]].updatedAt : 0;
        const tb = plans[b[0]] && plans[b[0]].updatedAt ? plans[b[0]].updatedAt : 0;
        return tb - ta;
      });
      ordered.forEach(([sessionId, items]) => {
        const record = plans[sessionId];
        const time = record && record.updatedAt
          ? new Date(record.updatedAt).toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit" })
          : "";
        const section = sectionNode("计划", items.length, time);
        if (animate) section.classList.add("animate");
        const wrap = document.createElement("div");
        wrap.className = "steps";
        items.forEach((task, index) => wrap.appendChild(stepNode(task, index)));
        section.appendChild(wrap);
        content.appendChild(section);
      });
    }

    if (manual.length) {
      const section = sectionNode("任务", manual.length);
      if (animate) section.classList.add("animate");
      manual.forEach((task, index) => section.appendChild(taskNode(task, index)));
      content.appendChild(section);
    }
  }  function renderProjects(data) {
    const projects = Array.isArray(data.projects) ? data.projects : [];
    const select = $("projectSelect");
    select.innerHTML = "";
    projects.forEach((project) => {
      const option = document.createElement("option");
      option.value = project.id;
      option.textContent = project.isInbox ? project.name + "（收件箱）" : project.name;
      if (String(project.id) === String(data.activeProjectId)) option.selected = true;
      select.appendChild(option);
    });
  }

  function render(data, animate) {
    state.data = data;
    state.demo = Boolean(data.demo);
    setMode(data.config && data.config.mode ? data.config.mode : "local");
    renderBanner();
    renderProjects(data);
    renderStats(data.stats || { total: 0, completed: 0, active: 0, percent: 0 });
    renderList(data, Boolean(animate));

    const last = data.lastPlan;
    const hint = $("lastPlanHint");
    const syncBtn = $("syncPlanBtn");
    if (last && Array.isArray(last.steps) && last.steps.length) {
      const when = last.updatedAt ? new Date(last.updatedAt) : null;
      const time = when && !Number.isNaN(when.getTime())
        ? when.toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit" })
        : "";
      hint.textContent = "最新计划 " + last.steps.length + " 步" + (time ? " · " + time : "");
      syncBtn.disabled = false;
    } else {
      hint.textContent = "在对话里说「同步计划到 Todoist」";
      syncBtn.disabled = true;
    }
  }

  async function callTool(name, args = {}) {
    if (state.demo) return { structuredContent: demoInvoke(name, args) };
    return bridge.callTool(name, args);
  }

  async function load(silent, justToggledId) {
    if (state.busy && !silent) return;
    state.busy = true;
    if (!silent) $("refreshBtn").classList.add("spin");
    try {
      const result = await callTool("todoist_board_data", {});
      const data = unwrap(result);
      if (!data || data.ok === false) throw new Error((data && data.error) || "读取失败");
      if (justToggledId && Array.isArray(data.tasks)) {
        const target = data.tasks.find((task) => String(task.id) === String(justToggledId));
        if (target) target._justToggled = true;
      }
      render(data, state.firstRender);
      state.firstRender = false;
    } catch (error) {
      if (!silent) {
        $("content").innerHTML = '<div class="empty"><h3>读取失败</h3><p>' +
          escapeHtml(error instanceof Error ? error.message : String(error)) + "</p></div>";
        toast("读取任务失败", "error");
      }
    } finally {
      state.busy = false;
      $("refreshBtn").classList.remove("spin");
    }
  }

  let demoStore = null;

  function ensureDemoStore() {
    if (!demoStore) {
      const data = demoData();
      demoStore = {
        tasks: data.tasks.map((task) => ({ ...task })),
        projects: data.projects.map((project) => ({ ...project })),
        activeProjectId: data.activeProjectId,
        labels: data.labels.slice(),
        lastPlan: data.lastPlan,
        lastPlans: data.lastPlans,
        seq: 100,
      };
    }
    return demoStore;
  }

  function demoBoardData() {
    const store = ensureDemoStore();
    const activeId = store.activeProjectId || (store.projects[0] && store.projects[0].id);
    const firstProjectId = store.projects[0] && store.projects[0].id;
    const tasks = store.tasks
      .filter((task) => (task.projectId || firstProjectId) === activeId)
      .sort((a, b) => (a.order || 0) - (b.order || 0));
    const completed = tasks.filter((task) => task.checked).length;
    return {
      demo: true,
      tasks,
      stats: {
        total: tasks.length,
        completed,
        active: tasks.length - completed,
        percent: tasks.length ? Math.round((completed / tasks.length) * 100) : 0,
      },
      config: { mode: "local", projectName: "Codex 任务", connected: false },
      projects: store.projects,
      activeProjectId: store.activeProjectId,
      labels: store.labels,
      lastPlan: store.lastPlan,
      lastPlans: store.lastPlans,
    };
  }

  function demoInvoke(name, args = {}) {
    const store = ensureDemoStore();
    const find = () => store.tasks.find((task) => String(task.id) === String(args.task_id));

    if (name === "todoist_board_data") return demoBoardData();

    if (name === "todoist_set_project") {
      store.activeProjectId = String(args.project_id);
      return { ok: true, mode: "local", project: store.projects.find((project) => project.id === store.activeProjectId) };
    }

    if (name === "todoist_create_project") {
      const project = { id: "demo-proj-" + (++store.seq), name: String(args.name || "").trim(), isInbox: false };
      if (!project.name) return { ok: false, error: "项目名称不能为空" };
      store.projects.push(project);
      store.activeProjectId = project.id;
      return { ok: true, mode: "local", project };
    }

    if (name === "todoist_reorder_tasks") {
      const ids = Array.isArray(args.task_ids) ? args.task_ids.map(String) : [];
      const byId = new Map(store.tasks.map((task) => [String(task.id), task]));
      store.tasks = ids.map((id) => byId.get(id)).filter(Boolean).map((task, index) => ({ ...task, order: index + 1 }));
      return { ok: true, mode: "local" };
    }

    if (name === "todoist_add_task") {
      const content = String(args.content || "").trim();
      if (!content) return { ok: false, error: "任务内容不能为空" };
      store.tasks.push({
        id: "demo-" + (++store.seq),
        content,
        checked: false,
        source: "manual",
        planStatus: null,
        projectId: args.project_id || store.activeProjectId,
        labels: Array.isArray(args.labels) ? args.labels : [],
        due: args.due_date || "",
        dueDate: args.due_date || "",
        priority: Number(args.priority) || 4,
        order: store.tasks.length + 1,
      });
      return { ok: true, mode: "local" };
    }

    if (name === "todoist_complete_task" || name === "todoist_reopen_task") {
      const task = find();
      if (!task) return { ok: false, error: "找不到任务" };
      task.checked = name === "todoist_complete_task";
      return { ok: true, mode: "local" };
    }

    if (name === "todoist_update_task") {
      const task = find();
      if (!task) return { ok: false, error: "找不到任务" };
      if (args.content !== undefined) {
        const content = String(args.content || "").trim();
        if (!content) return { ok: false, error: "任务内容不能为空" };
        task.content = content;
      }
      if (args.due_date !== undefined) {
        task.dueDate = String(args.due_date || "");
        task.due = task.dueDate;
      }
      if (args.priority !== undefined) task.priority = Number(args.priority) || 4;
      if (args.labels !== undefined) task.labels = Array.isArray(args.labels) ? args.labels : [];
      if (args.project_id !== undefined) task.projectId = String(args.project_id);
      return { ok: true, mode: "local" };
    }

    if (name === "todoist_delete_task") {
      const before = store.tasks.length;
      store.tasks = store.tasks.filter((task) => String(task.id) !== String(args.task_id));
      if (store.tasks.length === before) return { ok: false, error: "找不到任务" };
      return { ok: true, mode: "local" };
    }

    if (name === "todoist_sync_last_plan") {
      return { ok: true, mode: "local", created: 0, completed: 0, reopened: 0 };
    }

    return { ok: false, error: "演示模式不支持这个操作" };
  }

  function demoData() {
    const today = new Date();
    const iso = (d) => d.toISOString().slice(0, 10);
    return {
      demo: true,
      projects: [{ id: "demo-project", name: "Codex 任务", isInbox: false }],
      activeProjectId: "demo-project",
      labels: ["同步", "界面", "配置"],
      tasks: [
        { id: "demo-1", content: "梳理 Todoist 同步规则", checked: true, source: "plan", planStatus: "completed", sessionId: "demo", projectId: "demo-project", labels: ["同步"], due: "", dueDate: "", priority: 4, order: 1 },
        { id: "demo-2", content: "把 Codex 计划步骤自动建成任务", checked: true, source: "plan", planStatus: "completed", sessionId: "demo", projectId: "demo-project", labels: ["同步"], due: "", dueDate: "", priority: 4, order: 2 },
        { id: "demo-3", content: "在侧边栏展示完成进度", checked: false, source: "plan", planStatus: "inProgress", sessionId: "demo", projectId: "demo-project", labels: ["界面"], due: "今天", dueDate: iso(today), priority: 2, order: 3 },
        { id: "demo-4", content: "补上 Token 配置和错误提示", checked: false, source: "manual", planStatus: null, projectId: "demo-project", labels: ["配置"], due: "", dueDate: "", priority: 3, order: 4 },
        { id: "demo-5", content: "验证真实 Todoist 账号读写", checked: false, source: "manual", planStatus: null, projectId: "demo-project", labels: [], due: "", dueDate: "", priority: 4, order: 5 },
      ],
      stats: { total: 5, completed: 2, active: 3, percent: 40 },
      config: { mode: "local", projectName: "Codex 任务", connected: false },
      lastPlan: { steps: [{ step: "步骤 1", status: "completed" }, { step: "步骤 2", status: "completed" }, { step: "步骤 3", status: "pending" }], updatedAt: Date.now() },
      lastPlans: {
        demo: { sessionId: "demo", steps: [{ step: "步骤 1", status: "completed" }, { step: "步骤 2", status: "completed" }, { step: "步骤 3", status: "pending" }], updatedAt: Date.now() },
      },
    };
  }  let editingTask = null;
  let editingPriority = 4;
  let dragId = null;

  function setPriority(value) {
    editingPriority = value;
    document.querySelectorAll("#priorityGroup button").forEach((btn) => {
      btn.classList.toggle("active", Number(btn.dataset.priority) === value);
    });
  }

  function openEditor(task) {
    editingTask = task;
    $("editContent").value = task.content || "";
    $("editDue").value = task.dueDate || "";
    const projectSelect = $("editProject");
    projectSelect.innerHTML = "";
    const projects = state.data && Array.isArray(state.data.projects) ? state.data.projects : [];
    projects.forEach((project) => {
      const option = document.createElement("option");
      option.value = project.id;
      option.textContent = project.isInbox ? project.name + "（收件箱）" : project.name;
      projectSelect.appendChild(option);
    });
    projectSelect.value = task.projectId || (projects[0] ? projects[0].id : "");
    $("editLabels").value = (task.labels || []).join(", ");
    const priority = Number(task.priority);
    setPriority(priority >= 1 && priority <= 4 ? priority : 4);
    $("deleteConfirm").classList.add("hidden");
    $("modalBackdrop").classList.add("show");
    $("modal").classList.add("show");
    setTimeout(() => { $("editContent").focus(); $("editContent").select(); }, 60);
  }

  function closeEditor() {
    $("modalBackdrop").classList.remove("show");
    $("modal").classList.remove("show");
    editingTask = null;
  }

  async function saveEditor() {
    if (!editingTask) return;
    const content = $("editContent").value.trim();
    if (!content) { toast("任务内容不能为空", "error"); return; }
    const id = editingTask.id;
    $("saveBtn").disabled = true;
    try {
      const labels = $("editLabels").value
        .split(",")
        .map((label) => label.trim())
        .filter(Boolean);
      const result = await callTool("todoist_update_task", {
        task_id: id,
        content,
        due_date: $("editDue").value,
        priority: editingPriority,
        labels,
        project_id: $("editProject").value || undefined,
      });
      const data = unwrap(result);
      if (data && data.ok === false) throw new Error(data.error || "保存失败");
      closeEditor();
      toast("已保存");
      await load(true);
    } catch (error) {
      toast(error instanceof Error ? error.message : "保存失败", "error");
    } finally {
      $("saveBtn").disabled = false;
    }
  }

  function requestDelete() {
    $("deleteConfirm").classList.toggle("hidden");
  }

  async function confirmDelete() {
    if (!editingTask) return;
    const id = editingTask.id;
    $("confirmDelete").disabled = true;
    try {
      const result = await callTool("todoist_delete_task", { task_id: id });
      const data = unwrap(result);
      if (data && data.ok === false) throw new Error(data.error || "删除失败");
      closeEditor();
      toast("已删除");
      await load(true);
    } catch (error) {
      toast(error instanceof Error ? error.message : "删除失败", "error");
    } finally {
      $("confirmDelete").disabled = false;
    }
  }

  async function toggleTask(task) {
    if (state.busy) return;
    const previous = task.checked;
    task.checked = !previous;
    render(state.data);
    try {
      const result = await callTool(previous ? "todoist_reopen_task" : "todoist_complete_task", { task_id: task.id });
      const data = unwrap(result);
      if (data && data.ok === false) throw new Error(data.error || "操作失败");
      await load(true, task.id);
    } catch (error) {
      task.checked = previous;
      render(state.data);
      toast(error instanceof Error ? error.message : "操作失败", "error");
    }
  }

  async function addTask() {
    const input = $("newTask");
    const content = input.value.trim();
    if (!content || state.busy) return;
    state.busy = true;
    $("addBtn").disabled = true;
    try {
      const result = await callTool("todoist_add_task", { content });
      const data = unwrap(result);
      if (data && data.ok === false) throw new Error(data.error || "添加失败");
      input.value = "";
      toast("已添加");
      await load(true);
    } catch (error) {
      toast(error instanceof Error ? error.message : "添加失败", "error");
    } finally {
      state.busy = false;
      $("addBtn").disabled = false;
      input.focus();
    }
  }

  async function syncPlan() {
    if (state.busy) return;
    state.busy = true;
    $("syncPlanBtn").disabled = true;
    try {
      const result = await callTool("todoist_sync_last_plan", {});
      const data = unwrap(result);
      if (data && data.ok === false) throw new Error(data.error || "同步失败");
      toast("已同步：新建 " + (data.created || 0) + "，完成 " + (data.completed || 0));
      await load(true);
    } catch (error) {
      toast(error instanceof Error ? error.message : "同步失败", "error");
    } finally {
      state.busy = false;
      $("syncPlanBtn").disabled = false;
    }
  }

  function escapeHtml(text) {
    return String(text).replace(/[&<>"']/g, (ch) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
    }[ch]));
  }

  async function boot() {
    try {
      await bridge.connect();
      state.connected = true;
      await load();
    } catch {
      state.demo = true;
      setMode("local");
      render(demoData(), true);
      state.firstRender = false;
    }
    state.timer = setInterval(() => {
      if (!document.hidden && state.connected) load(true);
    }, 20000);
  }

  async function createProjectFromPopover() {
    const name = $("projectName").value.trim();
    if (!name) return;
    $("projectCreate").disabled = true;
    try {
      const result = await callTool("todoist_create_project", { name });
      const data = unwrap(result);
      if (data && data.ok === false) throw new Error(data.error || "创建失败");
      $("projectName").value = "";
      $("projectPopover").classList.add("hidden");
      toast("项目已创建");
      await load();
    } catch (error) {
      toast(error instanceof Error ? error.message : "创建失败", "error");
    } finally {
      $("projectCreate").disabled = false;
    }
  }

  $("refreshBtn").addEventListener("click", () => (state.connected ? load() : boot()));
  $("addBtn").addEventListener("click", addTask);
  $("syncPlanBtn").addEventListener("click", syncPlan);
  $("newTask").addEventListener("keydown", (event) => {
    if (event.key === "Enter") { event.preventDefault(); addTask(); }
  });
  $("modalClose").addEventListener("click", closeEditor);
  $("modalBackdrop").addEventListener("click", closeEditor);
  $("saveBtn").addEventListener("click", saveEditor);
  $("deleteBtn").addEventListener("click", requestDelete);
  $("cancelDelete").addEventListener("click", () => $("deleteConfirm").classList.add("hidden"));
  $("confirmDelete").addEventListener("click", confirmDelete);
  $("editContent").addEventListener("keydown", (event) => {
    if (event.key === "Enter") { event.preventDefault(); saveEditor(); }
  });
  document.querySelectorAll("#priorityGroup button").forEach((btn) => {
    btn.addEventListener("click", () => setPriority(Number(btn.dataset.priority)));
  });
  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape" && $("modal").classList.contains("show")) closeEditor();
  });

  $("projectSelect").addEventListener("change", async (event) => {
    try {
      const result = await callTool("todoist_set_project", { project_id: event.target.value });
      const data = unwrap(result);
      if (data && data.ok === false) throw new Error(data.error || "切换项目失败");
      await load();
    } catch (error) {
      toast(error instanceof Error ? error.message : "切换项目失败", "error");
    }
  });

  $("newProjectBtn").addEventListener("click", () => {
    const popover = $("projectPopover");
    popover.classList.toggle("hidden");
    if (!popover.classList.contains("hidden")) $("projectName").focus();
  });
  $("projectCreate").addEventListener("click", createProjectFromPopover);
  $("projectName").addEventListener("keydown", (event) => {
    if (event.key === "Enter") { event.preventDefault(); createProjectFromPopover(); }
  });

  $("searchInput").addEventListener("input", (event) => {
    state.query = event.target.value;
    if (state.data) renderList(state.data, false);
  });

  $("filterBar").addEventListener("click", (event) => {
    const chip = event.target.closest("[data-filter]");
    if (!chip) return;
    state.filter = chip.dataset.filter;
    document.querySelectorAll("#filterBar .chip").forEach((el) => {
      el.classList.toggle("active", el === chip);
    });
    if (state.data) renderList(state.data, false);
  });

  const contentEl = $("content");
  contentEl.addEventListener("dragstart", (event) => {
    const row = event.target.closest(".step, .task");
    if (!row) return;
    dragId = row.dataset.id;
    row.classList.add("dragging");
    event.dataTransfer.effectAllowed = "move";
    try { event.dataTransfer.setData("text/plain", dragId); } catch {}
  });
  contentEl.addEventListener("dragend", () => {
    dragId = null;
    contentEl.querySelectorAll(".dragging, .drop-target").forEach((el) => {
      el.classList.remove("dragging", "drop-target");
    });
  });
  contentEl.addEventListener("dragover", (event) => {
    const row = event.target.closest(".step, .task");
    if (!row || !dragId || row.dataset.id === dragId) return;
    const source = Array.from(contentEl.querySelectorAll(".step, .task")).find((el) => el.dataset.id === dragId);
    if (!source || source.parentElement !== row.parentElement) return;
    event.preventDefault();
    contentEl.querySelectorAll(".drop-target").forEach((el) => el.classList.remove("drop-target"));
    row.classList.add("drop-target");
  });
  contentEl.addEventListener("dragleave", (event) => {
    const row = event.target.closest(".step, .task");
    if (row) row.classList.remove("drop-target");
  });
  contentEl.addEventListener("drop", async (event) => {
    const row = event.target.closest(".step, .task");
    if (!row || !dragId || row.dataset.id === dragId) return;
    const source = Array.from(contentEl.querySelectorAll(".step, .task")).find((el) => el.dataset.id === dragId);
    if (!source || source.parentElement !== row.parentElement) return;
    event.preventDefault();

    const order = (state.data && Array.isArray(state.data.tasks) ? state.data.tasks : []).map((task) => String(task.id));
    const from = order.indexOf(String(dragId));
    const to = order.indexOf(String(row.dataset.id));
    if (from < 0 || to < 0) return;
    const moved = order.splice(from, 1)[0];
    order.splice(to, 0, moved);

    const byId = new Map((state.data.tasks || []).map((task) => [String(task.id), task]));
    state.data.tasks = order
      .map((id) => byId.get(id))
      .filter(Boolean)
      .map((task, index) => ({ ...task, order: index + 1 }));
    renderList(state.data, false);

    try {
      const result = await callTool("todoist_reorder_tasks", { task_ids: order });
      const data = unwrap(result);
      if (data && data.ok === false) throw new Error(data.error || "排序失败");
      await load(true);
    } catch (error) {
      toast(error instanceof Error ? error.message : "排序失败", "error");
      await load(true);
    }
  });

  boot();
})();
</script>
</body>
</html>
