<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Todoist · Lumen Flow</title>
<style>
  :root {
    color-scheme: light dark;
    --mx: 14%; --my: 8%;
    --bg: #f4f7fb; --bg-2: #eaf1f9;
    --ink: #10151d; --muted: #687383; --soft: #8d98a8;
    --accent: #2e8cff; --accent-2: #6de3ff;
    --glass: rgba(255,255,255,.58);
    --glass-strong: rgba(255,255,255,.84);
    --card: rgba(255,255,255,.66);
    --line: rgba(16,31,48,.09); --line-strong: rgba(16,31,48,.16);
    --glow: rgba(46,140,255,.22);
    --shadow: 0 24px 80px rgba(40,70,120,.14);
    --shadow-card: 0 16px 40px rgba(40,70,120,.10);
    --danger: #d54d5a;
    --spring: cubic-bezier(.16,1,.3,1.08);
    --radius-xl: 32px; --radius-lg: 24px; --radius-md: 16px; --radius-sm: 10px;
  }
  html.dark {
    --bg: #0b0e13; --bg-2: #131a24;
    --ink: #f5f8ff; --muted: #9ba8b9; --soft: #718093;
    --accent: #4aa8ff; --accent-2: #8ae9ff;
    --glass: rgba(22,29,40,.64); --glass-strong: rgba(26,34,48,.88);
    --card: rgba(30,39,54,.64);
    --line: rgba(255,255,255,.10); --line-strong: rgba(255,255,255,.19);
    --glow: rgba(74,168,255,.25);
    --shadow: 0 30px 100px rgba(0,0,0,.45);
    --shadow-card: 0 18px 50px rgba(0,0,0,.30);
    --danger: #ff7180;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b0e13; --bg-2: #131a24;
      --ink: #f5f8ff; --muted: #9ba8b9; --soft: #718093;
      --accent: #4aa8ff; --accent-2: #8ae9ff;
      --glass: rgba(22,29,40,.64); --glass-strong: rgba(26,34,48,.88);
      --card: rgba(30,39,54,.64);
      --line: rgba(255,255,255,.10); --line-strong: rgba(255,255,255,.19);
      --glow: rgba(74,168,255,.25);
      --shadow: 0 30px 100px rgba(0,0,0,.45);
      --shadow-card: 0 18px 50px rgba(0,0,0,.30);
      --danger: #ff7180;
    }
  }
  html.light {
    --bg: #f4f7fb; --bg-2: #eaf1f9;
    --ink: #10151d; --muted: #687383; --soft: #8d98a8;
    --accent: #2e8cff; --accent-2: #6de3ff;
    --glass: rgba(255,255,255,.58); --glass-strong: rgba(255,255,255,.84);
    --card: rgba(255,255,255,.66);
    --line: rgba(16,31,48,.09); --line-strong: rgba(16,31,48,.16);
    --glow: rgba(46,140,255,.22);
    --shadow: 0 24px 80px rgba(40,70,120,.14);
    --shadow-card: 0 16px 40px rgba(40,70,120,.10);
    --danger: #d54d5a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { min-height: 100%; }
  body {
    margin: 0; overflow-x: hidden; color: var(--ink);
    background:
      radial-gradient(circle at var(--mx) var(--my), var(--glow), transparent 28%),
      radial-gradient(circle at 82% 10%, rgba(109,227,255,.10), transparent 24%),
      linear-gradient(145deg, var(--bg), var(--bg-2));
    font-family: "MiSans", -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 14px; line-height: 1.5; font-feature-settings: "tnum" 1;
    -webkit-font-smoothing: antialiased;
  }
  body::before {
    content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none; opacity: .045;
    background-image: radial-gradient(rgba(0,0,0,.65) .45px, transparent .6px);
    background-size: 4px 4px; mix-blend-mode: multiply;
  }
  html.dark body::before { opacity: .08; mix-blend-mode: screen; }
  button, input, select { font: inherit; color: inherit; }
  button { border: 0; background: none; padding: 0; cursor: pointer; }
  .aurora {
    position: fixed; inset: -18%; z-index: -2; pointer-events: none;
    background:
      radial-gradient(circle at 20% 25%, rgba(64,162,255,.25), transparent 22%),
      radial-gradient(circle at 78% 18%, rgba(111,231,255,.18), transparent 20%),
      radial-gradient(circle at 52% 88%, rgba(125,115,255,.13), transparent 24%);
    filter: blur(34px); animation: aurora 16s ease-in-out infinite alternate;
  }
  .app { position: relative; width: min(1240px, 100%); margin: 0 auto; padding: 28px 32px 22px; }
  .glass, .glass-strong {
    border: 1px solid var(--line); box-shadow: var(--shadow);
    -webkit-backdrop-filter: blur(26px) saturate(1.22);
    backdrop-filter: blur(26px) saturate(1.22);
  }
  .glass { background: var(--glass); }
  .glass-strong { background: var(--glass-strong); }
  .topbar {
    position: sticky; top: 16px; z-index: 20; display: flex; align-items: center;
    justify-content: space-between; gap: 16px; padding: 14px 18px; border-radius: 24px;
  }
  .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .brand-mark {
    width: 40px; height: 40px; flex: 0 0 auto; display: grid; place-items: center;
    border-radius: 15px; color: #fff; background: linear-gradient(135deg, var(--accent), var(--accent-2));
    box-shadow: 0 10px 30px var(--glow);
  }
  .brand-mark svg { width: 21px; height: 21px; }
  .brand h1 { margin: 0; font-size: 16px; line-height: 1.1; letter-spacing: -.03em; font-weight: 650; }
  .brand p { margin: 3px 0 0; font-size: 10.5px; color: var(--muted); letter-spacing: .12em; text-transform: uppercase; }
  .top-actions { display: flex; align-items: center; gap: 8px; }
  .mode-pill {
    display: inline-flex; align-items: center; gap: 7px; height: 30px; padding: 0 11px;
    border-radius: 999px; border: 1px solid var(--line); color: var(--muted);
    background: rgba(255,255,255,.16); font-size: 11px; white-space: nowrap;
  }
  .mode-pill i { width: 6px; height: 6px; border-radius: 50%; background: var(--soft); }
  .mode-pill.live i { background: var(--accent); box-shadow: 0 0 0 5px var(--glow); animation: breathe 2.4s ease-in-out infinite; }
  .mode-pill.local i { background: #f2a93b; }
  .icon-button {
    width: 34px; height: 34px; display: grid; place-items: center; color: var(--muted);
    border-radius: 12px; transition: background .25s ease, color .25s ease, transform .35s var(--spring);
  }
  .icon-button:hover { background: rgba(127,127,127,.12); color: var(--ink); }
  .icon-button svg { width: 16px; height: 16px; }
  .icon-button:active, .pressable:active { transform: scale(.94); }
  .workspace { display: grid; gap: 18px; margin-top: 20px; }
  .fluid-cloud {
    position: relative; overflow: hidden; display: grid; grid-template-columns: minmax(0,1.15fr) minmax(260px,.85fr);
    gap: 24px; padding: 26px 28px; border-radius: var(--radius-xl);
  }
  .fluid-cloud::before {
    content: ""; position: absolute; width: 340px; height: 340px; right: -100px; top: -190px;
    border-radius: 50%; background: radial-gradient(circle, var(--glow), transparent 68%);
    pointer-events: none;
  }
  .fluid-cloud::after {
    content: ""; position: absolute; left: 28px; right: 28px; bottom: 0; height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent); opacity: .34;
  }
  .cloud-copy { position: relative; z-index: 1; min-width: 0; }
  .eyebrow { display: block; color: var(--accent); font-size: 10px; font-weight: 650; letter-spacing: .2em; text-transform: uppercase; }
  .cloud-copy h2 { margin: 7px 0 4px; font-size: clamp(22px, 3.2vw, 34px); line-height: 1.12; letter-spacing: -.055em; font-weight: 620; }
  .cloud-copy p { margin: 0; color: var(--muted); font-size: 12px; }
  .project-row { display: flex; align-items: center; gap: 8px; margin-top: 18px; position: relative; max-width: 420px; }
  .project-select {
    width: 100%; height: 36px; padding: 0 12px; border-radius: 12px; border: 1px solid var(--line);
    background: rgba(255,255,255,.16); color: var(--ink); font-size: 12px; outline: none;
    -webkit-appearance: none; appearance: none;
    background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position: calc(100% - 15px) 15px, calc(100% - 10px) 15px;
    background-size: 5px 5px, 5px 5px; background-repeat: no-repeat;
  }
  .project-select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--glow); }
  .project-row .icon-button { flex: 0 0 auto; width: 36px; height: 36px; border-radius: 12px; border: 1px solid var(--line); }
  .popover {
    position: absolute; top: 44px; left: 0; right: 44px; z-index: 30; display: flex; gap: 6px; padding: 8px;
    border: 1px solid var(--line); border-radius: 15px; background: var(--glass-strong);
    box-shadow: var(--shadow); -webkit-backdrop-filter: blur(22px); backdrop-filter: blur(22px);
  }
  .popover input { flex: 1; min-width: 0; height: 32px; padding: 0 10px; border: 1px solid var(--line); border-radius: 10px; background: rgba(127,127,127,.08); color: var(--ink); outline: none; font-size: 12px; }
  .popover input:focus { border-color: var(--accent); }
  .popover button { height: 32px; padding: 0 12px; border-radius: 10px; background: var(--ink); color: var(--bg); font-size: 12px; font-weight: 600; }
  .cloud-meter { position: relative; z-index: 1; align-self: center; padding: 18px; border-radius: 22px; border: 1px solid var(--line); background: rgba(255,255,255,.12); }
  .meter-label, .meter-counts { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; color: var(--muted); font-size: 11px; }
  .meter-label b { color: var(--ink); font-size: 20px; letter-spacing: -.04em; }
  .meter-track { height: 8px; margin: 13px 0 12px; overflow: hidden; border-radius: 999px; background: rgba(127,127,127,.14); }
  .meter-track i { display: block; width: 0%; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--accent), var(--accent-2)); box-shadow: 0 0 20px var(--glow); transition: width .8s var(--spring); position: relative; }
  .meter-track i::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,.55), transparent); animation: shimmer 2.8s ease-in-out infinite; }
  .meter-counts b { color: var(--ink); font-weight: 600; }
  .control-deck { display: grid; gap: 12px; padding: 16px 18px; border-radius: 24px; }
  .search-box { display: flex; align-items: center; gap: 9px; height: 38px; padding: 0 12px; border: 1px solid var(--line); border-radius: 13px; background: rgba(127,127,127,.055); }
  .search-box:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--glow); }
  .search-box svg { width: 15px; height: 15px; color: var(--soft); flex: 0 0 auto; }
  .search-box input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--ink); font-size: 12.5px; }
  input::placeholder { color: var(--soft); }
  .filter-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .session-bar { display: flex; flex-wrap: wrap; gap: 6px; }
  .session-chip { max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .session-chip .n { margin-left: 4px; opacity: .55; font-variant-numeric: tabular-nums; }
  .chip {
    height: 28px; padding: 0 11px; border-radius: 10px; border: 1px solid transparent;
    background: rgba(127,127,127,.07); color: var(--muted); font-size: 11px;
    transition: background .25s ease, color .25s ease, border-color .25s ease, transform .35s var(--spring);
  }
  .chip:hover { background: rgba(127,127,127,.13); color: var(--ink); }
  .chip:active { transform: scale(.95); }
  .chip.active { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .action-row { display: flex; align-items: center; gap: 10px; }
  .quick-add { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; padding: 4px 5px 4px 13px; border: 1px solid var(--line); border-radius: 14px; background: rgba(127,127,127,.045); }
  .quick-add:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--glow); }
  .quick-add input { flex: 1; min-width: 0; height: 30px; border: 0; outline: 0; background: transparent; font-size: 12.5px; }
  .add-button { width: 30px; height: 30px; flex: 0 0 auto; display: grid; place-items: center; border-radius: 10px; background: var(--ink); color: var(--bg); transition: transform .35s var(--spring), opacity .2s; }
  .add-button:hover { opacity: .82; }
  .add-button:active { transform: scale(.9) rotate(8deg); }
  .add-button svg { width: 14px; height: 14px; }
  .sync-button { height: 38px; padding: 0 13px; border: 1px solid var(--line); border-radius: 12px; color: var(--muted); background: rgba(127,127,127,.04); font-size: 11.5px; white-space: nowrap; transition: background .25s, color .25s, transform .35s var(--spring); }
  .sync-button:hover { background: rgba(127,127,127,.12); color: var(--ink); }
  .sync-button:active { transform: scale(.95); }
  .sync-button:disabled { opacity: .4; cursor: default; }
  .hint { min-height: 15px; color: var(--soft); font-size: 10.5px; }
  .banner { display: flex; gap: 9px; align-items: flex-start; padding: 11px 13px; border: 1px solid var(--line); border-radius: 15px; color: var(--muted); background: rgba(127,127,127,.06); font-size: 11.5px; }
  .banner svg { flex: 0 0 auto; width: 14px; height: 14px; margin-top: 1px; color: var(--accent); }
  .content { display: grid; gap: 22px; }
  .section { animation: sectionIn .45s var(--spring) both; }
  .section-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .section-head h2 { margin: 0; max-width: min(72%, 520px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; font-weight: 650; letter-spacing: .01em; }
  .section-count { color: var(--soft); font-size: 10.5px; font-variant-numeric: tabular-nums; }
  .section-note { color: var(--soft); font-size: 10.5px; }
  .section-line { flex: 1; height: 1px; background: var(--line); }
  .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(226px, 1fr)); gap: 14px; align-items: stretch; }
  .task-card {
    --x: 50%; --y: 0%;
    position: relative; overflow: hidden; min-height: 176px; display: flex; flex-direction: column; gap: 13px;
    padding: 17px 17px 14px; border: 1px solid var(--line); border-radius: 23px; background: var(--card);
    box-shadow: var(--shadow-card), inset 0 1px 0 rgba(255,255,255,.25);
    -webkit-backdrop-filter: blur(20px) saturate(1.16); backdrop-filter: blur(20px) saturate(1.16);
    transition: transform .48s var(--spring), border-color .3s ease, box-shadow .48s ease, background .3s ease;
  }
  .task-card::before {
    content: ""; position: absolute; left: 17px; right: 17px; top: 0; height: 2px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2), transparent);
    opacity: .7; border-radius: 0 0 3px 3px;
  }
  .task-card::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(220px circle at var(--x) var(--y), var(--glow), transparent 68%);
    opacity: 0; transition: opacity .3s ease;
  }
  .task-card:hover { transform: translateY(-4px) rotateX(1.2deg); border-color: var(--line-strong); box-shadow: 0 24px 60px rgba(40,90,160,.18); }
  .task-card:hover::after { opacity: 1; }
  .task-card.is-done { background: rgba(127,127,127,.08); box-shadow: none; opacity: .78; }
  .task-card.is-done::before { background: linear-gradient(90deg, var(--soft), transparent); }
  .task-card.is-active::before { opacity: 1; }
  .card-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; position: relative; z-index: 1; }
  .card-index { color: var(--soft); font-size: 10px; font-weight: 650; letter-spacing: .16em; font-variant-numeric: tabular-nums; }
  .card-top .card-more { margin-left: 2px; flex: 0 0 auto; }
  .card-more { width: 24px; height: 24px; display: grid; place-items: center; border-radius: 8px; color: var(--soft); opacity: .55; transition: background .2s, color .2s, opacity .2s; }
  .task-card:hover .card-more, .card-more:focus-visible { opacity: 1; }
  .card-more:hover { color: var(--ink); background: rgba(127,127,127,.13); }
  .card-more svg { width: 14px; height: 14px; }
  .card-main { display: flex; align-items: flex-start; gap: 10px; position: relative; z-index: 1; }
  .card-check { width: 25px; height: 25px; flex: 0 0 auto; display: grid; place-items: center; border-radius: 9px; border: 1.5px solid var(--line-strong); color: transparent; background: rgba(127,127,127,.04); transition: transform .35s var(--spring), background .22s, color .22s, border-color .22s; }
  .card-check:hover { border-color: var(--accent); }
  .card-check:active { transform: scale(.82) rotate(-6deg); }
  .card-check svg { width: 12px; height: 12px; stroke-width: 2.8; }
  .is-done .card-check { background: var(--accent); border-color: var(--accent); color: #fff; }
  .card-title { margin: 0; min-width: 0; font-size: 14px; line-height: 1.5; font-weight: 520; letter-spacing: -.015em; word-break: break-word; cursor: text; }
  .is-done .card-title { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 1px; }
  .card-meta { display: flex; flex-wrap: wrap; gap: 5px 7px; align-items: center; color: var(--muted); font-size: 10.5px; position: relative; z-index: 1; }
  .meta-dot { width: 3px; height: 3px; border-radius: 50%; background: var(--soft); }
  .label-row { display: flex; flex-wrap: wrap; gap: 5px; position: relative; z-index: 1; }
  .label-pill { padding: 2px 7px; border-radius: 7px; background: rgba(46,140,255,.11); color: var(--accent); font-size: 9.5px; line-height: 1.4; }
  .card-foot { margin-top: auto; display: flex; align-items: center; justify-content: space-between; gap: 8px; color: var(--soft); font-size: 10px; position: relative; z-index: 1; }
  .card-status { display: inline-flex; align-items: center; gap: 5px; }
  .card-status i { width: 5px; height: 5px; border-radius: 50%; background: var(--soft); }
  .is-active .card-status i { background: var(--accent); box-shadow: 0 0 0 4px var(--glow); }
  .is-done .card-status i { background: var(--ink); }
  .drag-grip { width: 18px; height: 18px; display: grid; place-items: center; color: var(--soft); opacity: 0; cursor: grab; transition: opacity .2s; }
  .task-card:hover .drag-grip { opacity: .8; }
  .drag-grip svg { width: 12px; height: 12px; }
  .task-card.dragging { opacity: .4; transform: scale(.97); }
  .task-card.drop-target { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), 0 20px 50px var(--glow); }
  .empty, .no-results { display: flex; min-height: 260px; align-items: center; justify-content: center; text-align: center; color: var(--muted); }
  .empty-inner { max-width: 340px; padding: 30px; border: 1px dashed var(--line-strong); border-radius: 24px; background: rgba(127,127,127,.04); }
  .empty h3 { margin: 0 0 6px; color: var(--ink); font-size: 15px; }
  .empty p { margin: 0; font-size: 12px; }
  .empty button { margin-top: 16px; height: 34px; padding: 0 14px; border-radius: 11px; background: var(--ink); color: var(--bg); font-size: 12px; }
  .footnote { margin-top: 26px; text-align: center; color: var(--soft); font-size: 10px; }
  .modal-backdrop { position: fixed; inset: 0; z-index: 40; background: rgba(5,10,18,.36); opacity: 0; visibility: hidden; transition: opacity .28s ease, visibility .28s ease; -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); }
  .modal-backdrop.is-open { opacity: 1; visibility: visible; }
  .editor-sheet {
    position: fixed; left: 50%; top: 50%; z-index: 41; width: min(430px, calc(100vw - 32px));
    padding: 22px; border-radius: 28px; transform: translate(-50%, -46%) scale(.96); opacity: 0; visibility: hidden;
    transition: opacity .28s ease, transform .52s var(--spring), visibility .28s ease;
  }
  .editor-sheet.is-open { opacity: 1; visibility: visible; transform: translate(-50%, -50%) scale(1); }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  .sheet-head h2 { margin: 0; font-size: 15px; letter-spacing: -.02em; }
  .sheet-close { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 10px; color: var(--muted); }
  .sheet-close:hover { background: rgba(127,127,127,.12); color: var(--ink); }
  .field { margin-bottom: 13px; }
  .field label { display: block; margin-bottom: 6px; color: var(--muted); font-size: 10.5px; }
  .field input, .field select {
    width: 100%; height: 38px; padding: 0 11px; border: 1px solid var(--line); border-radius: 12px;
    outline: none; background: rgba(127,127,127,.06); color: var(--ink); font-size: 12.5px;
  }
  .field input:focus, .field select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--glow); }
  .priority-row { display: flex; gap: 6px; }
  .priority-row button { flex: 1; height: 34px; border-radius: 10px; background: rgba(127,127,127,.08); color: var(--muted); font-size: 11px; }
  .priority-row button.active { background: var(--ink); color: var(--bg); }
  .sheet-actions { display: flex; gap: 8px; margin-top: 18px; }
  .sheet-actions button { flex: 1; height: 38px; border-radius: 12px; font-size: 12px; font-weight: 600; }
  .sheet-actions .delete { color: var(--danger); border: 1px solid var(--line); background: transparent; }
  .sheet-actions .save { color: var(--bg); background: var(--ink); }
  .delete-confirm { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 10px; padding: 10px 11px; border-radius: 12px; background: rgba(213,77,90,.1); color: var(--danger); font-size: 11px; }
  .delete-confirm button { height: 28px; padding: 0 10px; border-radius: 8px; background: var(--danger); color: #fff; font-size: 11px; }
  .toast { position: fixed; left: 50%; bottom: 24px; z-index: 50; max-width: min(86vw, 420px); padding: 10px 14px; border: 1px solid var(--line); border-radius: 13px; background: var(--glass-strong); color: var(--ink); box-shadow: var(--shadow); font-size: 11.5px; transform: translate(-50%, 10px); opacity: 0; pointer-events: none; transition: opacity .25s, transform .4s var(--spring); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .toast.error { color: var(--danger); }
  .hidden { display: none !important; }
  @keyframes aurora { from { transform: translate3d(-2%, -1%, 0) scale(1); } to { transform: translate3d(3%, 2%, 0) scale(1.08); } }
  @keyframes breathe { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
  @keyframes shimmer { 0% { transform: translateX(-100%); } 55%,100% { transform: translateX(180%); } }
  @keyframes sectionIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  @keyframes cardIn { from { opacity: 0; transform: translateY(16px) scale(.97); filter: blur(3px); } to { opacity: 1; transform: none; filter: none; } }
  .section.reveal .task-card { animation: cardIn .5s var(--spring) both; animation-delay: calc(var(--i, 0) * 38ms); }
  @media (max-width: 760px) {
    .app { padding: 18px 16px 20px; }
    .topbar { top: 10px; padding: 12px 14px; }
    .fluid-cloud { grid-template-columns: 1fr; padding: 22px; }
    .cloud-meter { padding: 16px; }
    .card-grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
  }
  @media (max-width: 560px) {
    .brand p { display: none; }
    .mode-pill { padding: 0 9px; }
    .action-row { align-items: stretch; flex-direction: column; }
    .sync-button { width: 100%; }
    .card-grid { grid-template-columns: 1fr; }
    .task-card { min-height: 0; }
    .editor-sheet { top: auto; left: 0; bottom: 0; width: 100%; transform: translateY(24px) scale(.98); border-radius: 28px 28px 0 0; padding-bottom: calc(22px + env(safe-area-inset-bottom)); }
    .editor-sheet.is-open { transform: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; scroll-behavior: auto !important; }
  }
</style>
</head>
<body>
  <div class="aurora" aria-hidden="true"></div>
  <div class="app">
    <header class="topbar glass">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7.5h9"/><path d="M5 12h14"/><path d="M5 16.5h7"/><path d="M17.5 7.5v6"/></svg>
        </span>
        <div><h1>Todoist</h1><p>Lumen flow</p></div>
      </div>
      <div class="top-actions">
        <span id="modePill" class="mode-pill"><i></i><span id="modeText">连接中</span></span>
        <button id="refreshBtn" class="icon-button pressable" type="button" title="刷新" aria-label="刷新">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-.6 3"/><path d="M20 4v7h-7"/></svg>
        </button>
      </div>
    </header>

    <main class="workspace">
      <section class="fluid-cloud glass" aria-label="任务概览">
        <div class="cloud-copy">
          <span class="eyebrow">CURRENT STREAM</span>
          <h2 id="projectTitle">任务</h2>
          <p id="summaryText">正在读取…</p>
          <div class="project-row">
            <select id="projectSelect" class="project-select" aria-label="项目"></select>
            <button id="newProjectBtn" class="icon-button pressable" type="button" title="新建项目" aria-label="新建项目">+</button>
            <div id="projectPopover" class="popover hidden">
              <input id="projectName" placeholder="项目名称" maxlength="80" autocomplete="off" />
              <button id="projectCreate" type="button">创建</button>
            </div>
          </div>
        </div>
        <div class="cloud-meter" aria-label="完成进度">
          <div class="meter-label"><span>完成度</span><b id="percentText">0%</b></div>
          <div class="meter-track"><i id="barFill"></i></div>
          <div class="meter-counts"><span><b id="doneNum">0</b> 已完成</span><span><b id="totalNum">0</b> 总计</span></div>
        </div>
      </section>

      <section class="control-deck glass" aria-label="任务控制">
        <div class="search-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="searchInput" type="text" placeholder="搜索任务或标签…" autocomplete="off" maxlength="120" />
        </div>
        <div id="sessionBar" class="session-bar" aria-label="会话分类"></div>
        <div class="action-row">
          <div class="quick-add">
            <input id="newTask" type="text" placeholder="添加任务…" autocomplete="off" maxlength="500" />
            <button id="addBtn" class="add-button pressable" type="button" aria-label="添加任务">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
            </button>
          </div>
          <button id="syncPlanBtn" class="sync-button pressable" type="button" disabled>同步最近计划</button>
        </div>
        <div id="lastPlanHint" class="hint">在对话里说「同步计划到 Todoist」</div>
      </section>

      <div id="banner"></div>
      <section id="content" class="content">
        <div class="empty"><div class="empty-inner"><h3>正在读取</h3><p>稍等一下…</p></div></div>
      </section>
    </main>
    <div class="footnote">数据来自 Todoist · 由 Codex 提供</div>
  </div>

  <div id="modalBackdrop" class="modal-backdrop"></div>
  <section id="modal" class="editor-sheet glass-strong" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="sheet-head"><h2 id="modalTitle">编辑任务</h2><button id="modalClose" class="sheet-close" type="button" aria-label="关闭">✕</button></div>
    <div class="field"><label for="editContent">内容</label><input id="editContent" maxlength="500" autocomplete="off" /></div>
    <div class="field"><label for="editDue">截止日期</label><input id="editDue" type="date" /></div>
    <div class="field"><label for="editProject">项目</label><select id="editProject" class="edit-select"></select></div>
    <div class="field"><label for="editLabels">标签</label><input id="editLabels" placeholder="用逗号分隔，例如：工作, 紧急" autocomplete="off" /></div>
    <div class="field"><label>优先级</label><div id="priorityGroup" class="priority-row"><button type="button" data-priority="1">P1</button><button type="button" data-priority="2">P2</button><button type="button" data-priority="3">P3</button><button type="button" data-priority="4">P4</button></div></div>
    <div class="sheet-actions"><button id="deleteBtn" class="delete" type="button">删除</button><button id="saveBtn" class="save" type="button">保存</button></div>
    <div id="deleteConfirm" class="delete-confirm hidden"><span>确定删除这条任务？</span><div><button id="cancelDelete" type="button">取消</button><button id="confirmDelete" type="button">删除</button></div></div>
  </section>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  "use strict";
  const LIVE_CONFIG = { port: Number("__SSE_PORT__"), token: "__SSE_TOKEN__" };
  const $ = (id) => document.getElementById(id);
  const state = {
    data: null, connected: false, demo: false, busy: false, firstRender: true,
    sessionFilter: "all", query: "", mode: null, live: false, liveSource: null,
    revision: null, revisionTimer: null, refreshTimer: null, dragId: null,
  };
  let editingTask = null;

  const previewTheme = new URLSearchParams(window.location.search).get("theme");
  if (previewTheme === "dark" || previewTheme === "light") document.documentElement.classList.add(previewTheme);

  const bridge = (() => {
    let seq = 0;
    const pending = new Map();
    const listeners = new Map();
    window.addEventListener("message", (event) => {
      if (event.source === window) return;
      const data = event.data;
      if (!data || typeof data !== "object") return;
      if (data.id != null && pending.has(data.id)) {
        const item = pending.get(data.id);
        pending.delete(data.id);
        clearTimeout(item.timer);
        if (data.error) item.reject(new Error(data.error.message || "请求失败"));
        else item.resolve(data.result);
        return;
      }
      if (typeof data.method === "string") {
        const handler = listeners.get(data.method);
        if (handler) handler(data.params || {});
      }
    });
    function request(method, params, timeout = 15000) {
      const id = ++seq;
      return new Promise((resolve, reject) => {
        const timer = setTimeout(() => { pending.delete(id); reject(new Error("timeout")); }, timeout);
        pending.set(id, { resolve, reject, timer });
        try { window.parent.postMessage({ jsonrpc: "2.0", id, method, params }, "*"); }
        catch (error) { clearTimeout(timer); pending.delete(id); reject(error); }
      });
    }
    function notify(method, params) { window.parent.postMessage({ jsonrpc: "2.0", method, params }, "*"); }
    async function connect() {
      if (window.parent === window) throw new Error("not-embedded");
      const params = {
        appCapabilities: { availableDisplayModes: ["inline", "fullscreen"] },
        appInfo: { name: "Todoist", version: "0.6.8" },
        protocolVersion: "2026-01-26",
      };
      let result;
      try { result = await request("ui/initialize", params, 4000); }
      catch { result = await request("ui/initialize", params, 4000); }
      notify("ui/notifications/initialized", {});
      applyHostContext(result && result.hostContext ? result.hostContext : {});
      return result;
    }
    async function callTool(name, args = {}) { return request("tools/call", { name, arguments: args }, 25000); }
    function on(method, handler) { listeners.set(method, handler); }
    return { connect, callTool, on };
  })();

  function applyHostContext(context) {
    const theme = context && context.theme;
    if (theme === "dark") { document.documentElement.classList.remove("light"); document.documentElement.classList.add("dark"); }
    else if (theme === "light") { document.documentElement.classList.remove("dark"); document.documentElement.classList.add("light"); }
  }
  bridge.on("ui/notifications/host-context-changed", applyHostContext);

  function unwrap(result) {
    if (result && result.structuredContent) return result.structuredContent;
    const text = result && Array.isArray(result.content)
      ? (result.content.find((item) => item && item.type === "text") || {}).text : null;
    if (!text) return null;
    try { return JSON.parse(text); } catch { return { ok: true, message: text }; }
  }
  function toast(message, kind) {
    const el = $("toast");
    el.textContent = message;
    el.className = "toast show" + (kind === "error" ? " error" : "");
    clearTimeout(toast.timer);
    toast.timer = setTimeout(() => { el.className = "toast"; }, 2600);
  }
  function setMode(mode) {
    state.mode = mode;
    const pill = $("modePill");
    pill.classList.remove("live", "local");
    if (mode === "local") pill.classList.add("local");
    updateModeLabel();
  }
  function setLive(live) { state.live = Boolean(live); updateModeLabel(); }
  function updateModeLabel() {
    const base = state.mode === "todoist" ? "Todoist" : state.mode === "local" ? "本地" : "连接中";
    $("modeText").textContent = base + (state.live ? " · 实时" : state.connected ? " · 自动" : "");
    $("modePill").classList.toggle("live", state.live);
  }
  function connectLive() {
    if (!Number.isFinite(LIVE_CONFIG.port) || !LIVE_CONFIG.token || LIVE_CONFIG.token === "__SSE_TOKEN__") return;
    if (state.liveSource) return;
    try {
      const source = new EventSource(`http://127.0.0.1:${LIVE_CONFIG.port}/events/${LIVE_CONFIG.token}`);
      state.liveSource = source;
      source.onopen = () => setLive(true);
      source.onerror = () => setLive(false);
      source.addEventListener("changed", () => load(true));
    } catch { setLive(false); }
  }
  function renderBanner() {
    const el = $("banner");
    if (!state.demo) { el.innerHTML = ""; return; }
    el.innerHTML = '<div class="banner"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 9v4"/><path d="M12 17h.01"/><circle cx="12" cy="12" r="9"/></svg><div>当前是演示数据。在 Codex 侧边栏里打开会读取真实待办。</div></div>';
  }
  function renderStats(stats) {
    const total = Number(stats.total) || 0;
    const done = Number(stats.completed) || 0;
    const percent = Number(stats.percent) || 0;
    $("doneNum").textContent = String(done);
    $("totalNum").textContent = String(total);
    $("percentText").textContent = percent + "%";
    $("summaryText").textContent = `${stats.active || 0} 项待办 · ${done} 项已完成`;
    requestAnimationFrame(() => { $("barFill").style.width = percent + "%"; });
  }
  function renderProjects(data) {
    const projects = Array.isArray(data.projects) ? data.projects : [];
    const select = $("projectSelect");
    select.innerHTML = "";
    projects.forEach((project) => {
      const option = document.createElement("option");
      option.value = project.id;
      option.textContent = project.isInbox ? project.name + "（收件箱）" : project.name;
      if (String(project.id) === String(data.activeProjectId)) option.selected = true;
      select.appendChild(option);
    });
    const current = projects.find((project) => String(project.id) === String(data.activeProjectId));
    $("projectTitle").textContent = current ? current.name : "任务";
  }
  function renderPlanHint(data) {
    const last = data.lastPlan;
    const hint = $("lastPlanHint");
    const button = $("syncPlanBtn");
    if (last && Array.isArray(last.steps) && last.steps.length) {
      const session = last.sessionId ? ` · ${sessionLabel(last.sessionId, data)}` : "";
      hint.textContent = `最近计划 ${last.steps.length} 步` + session + (last.updatedAt ? ` · ${new Date(last.updatedAt).toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit" })}` : "");
      button.disabled = false;
    } else {
      hint.textContent = "在对话里说「同步计划到 Todoist」";
      button.disabled = true;
    }
  }
  function applyFilters(tasks) {
    const query = state.query.trim().toLowerCase();
    if (!query) return tasks;
    return tasks.filter((task) => (task.content + " " + (task.labels || []).join(" ")).toLowerCase().includes(query));
  }
  function sessionKey(sessionId) { return sessionId ? String(sessionId) : "unassigned"; }
  function renderSessionBar(data, tasks) {
    const bar = $("sessionBar");
    const counts = new Map();
    tasks.forEach((task) => {
      const key = sessionKey(task.sessionId);
      counts.set(key, (counts.get(key) || 0) + 1);
    });
    const plans = data.lastPlans && typeof data.lastPlans === "object" ? data.lastPlans : {};
    const entries = Array.from(counts.entries()).sort((a, b) => {
      const ta = a[0] !== "unassigned" && plans[a[0]] && plans[a[0]].updatedAt ? plans[a[0]].updatedAt : 0;
      const tb = b[0] !== "unassigned" && plans[b[0]] && plans[b[0]].updatedAt ? plans[b[0]].updatedAt : 0;
      if (ta !== tb) return tb - ta;
      return sessionLabel(a[0] === "unassigned" ? null : a[0], data).localeCompare(sessionLabel(b[0] === "unassigned" ? null : b[0], data), "zh-CN");
    });
    const keys = new Set(entries.map(([key]) => key));
    if (state.sessionFilter !== "all" && !keys.has(state.sessionFilter)) state.sessionFilter = "all";
    bar.innerHTML = "";
    const makeChip = (key, label, count) => {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "chip session-chip" + (state.sessionFilter === key ? " active" : "");
      button.dataset.session = key;
      button.title = key === "unassigned" ? "没有会话归属的任务" : key;
      button.textContent = label;
      const countEl = document.createElement("span");
      countEl.className = "n";
      countEl.textContent = String(count);
      button.appendChild(countEl);
      bar.appendChild(button);
    };
    makeChip("all", "全部会话", tasks.length);
    entries.forEach(([key, count]) => makeChip(key, sessionLabel(key === "unassigned" ? null : key, data), count));
  }
  function sectionNode(label, count, note, animate) {
    const section = document.createElement("section");
    section.className = "section" + (animate ? " reveal" : "");
    const head = document.createElement("div");
    head.className = "section-head";
    const h2 = document.createElement("h2");
    h2.textContent = label;
    const cnt = document.createElement("span");
    cnt.className = "section-count";
    cnt.textContent = String(count);
    head.append(h2, cnt);
    if (note) {
      const noteEl = document.createElement("span");
      noteEl.className = "section-note";
      noteEl.textContent = "· " + note;
      head.appendChild(noteEl);
    }
    const line = document.createElement("span");
    line.className = "section-line";
    head.appendChild(line);
    section.appendChild(head);
    return section;
  }
  function sessionShort(sessionId) {
    const clean = String(sessionId || "").replace(/[^a-zA-Z0-9]/g, "");
    return clean ? clean.slice(-6) : "default";
  }
  function sessionLabel(sessionId, data = state.data) {
    if (!sessionId) return "未标记会话";
    const title = data && data.sessionLabels ? data.sessionLabels[String(sessionId)] : "";
    if (title) return title;
    const short = sessionShort(sessionId);
    const latest = data && data.lastPlan && data.lastPlan.sessionId ? String(data.lastPlan.sessionId) : "";
    return (latest === String(sessionId) ? "最近会话 · " : "会话 ") + short;
  }
  function statusText(task) {
    if (task.checked) return "已完成";
    if (task.planStatus === "inProgress") return "进行中";
    return task.source === "plan" ? "待开始" : "未开始";
  }
  function cardNode(task, index, kind, animate) {
    const card = document.createElement("article");
    card.className = "task-card" + (task.checked ? " is-done" : "") + (task.planStatus === "inProgress" ? " is-active" : "");
    card.style.setProperty("--i", String(index || 0));
    card.dataset.id = String(task.id);
    card.draggable = true;
    card.addEventListener("pointermove", (event) => {
      const rect = card.getBoundingClientRect();
      card.style.setProperty("--x", (event.clientX - rect.left) + "px");
      card.style.setProperty("--y", (event.clientY - rect.top) + "px");
    });
    card.addEventListener("dragstart", (event) => {
      state.dragId = String(task.id);
      card.classList.add("dragging");
      if (event.dataTransfer) { event.dataTransfer.effectAllowed = "move"; event.dataTransfer.setData("text/plain", String(task.id)); }
    });
    card.addEventListener("dragend", () => { state.dragId = null; card.classList.remove("dragging"); });
    card.addEventListener("dragover", (event) => { event.preventDefault(); if (state.dragId && state.dragId !== String(task.id)) card.classList.add("drop-target"); });
    card.addEventListener("dragleave", () => card.classList.remove("drop-target"));
    card.addEventListener("drop", async (event) => {
      event.preventDefault();
      card.classList.remove("drop-target");
      if (state.dragId && state.dragId !== String(task.id)) await reorderTasks(state.dragId, String(task.id));
    });

    const top = document.createElement("div");
    top.className = "card-top";
    const indexEl = document.createElement("span");
    indexEl.className = "card-index";
    indexEl.textContent = kind === "plan" ? String((index || 0) + 1).padStart(2, "0") : "TASK";
    const more = document.createElement("button");
    more.className = "card-more pressable";
    more.type = "button";
    more.setAttribute("aria-label", "编辑任务");
    more.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>';
    more.addEventListener("click", (event) => { event.stopPropagation(); openEditor(task); });
    top.append(indexEl, more);

    const main = document.createElement("div");
    main.className = "card-main";
    const check = document.createElement("button");
    check.className = "card-check pressable";
    check.type = "button";
    check.setAttribute("aria-label", task.checked ? "标记为未完成" : "标记为完成");
    check.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.2 4.2L19 7"/></svg>';
    check.addEventListener("click", (event) => { event.stopPropagation(); toggleTask(task); });
    const title = document.createElement("h3");
    title.className = "card-title";
    title.textContent = task.content || "(无标题)";
    title.addEventListener("click", () => openEditor(task));
    main.append(check, title);

    const meta = document.createElement("div");
    meta.className = "card-meta";
    const metaParts = [statusText(task), task.due].filter(Boolean);
    metaParts.forEach((part, partIndex) => {
      if (partIndex) { const dot = document.createElement("span"); dot.className = "meta-dot"; meta.appendChild(dot); }
      const span = document.createElement("span"); span.textContent = part; meta.appendChild(span);
    });

    const labels = document.createElement("div");
    labels.className = "label-row";
    (Array.isArray(task.labels) ? task.labels : []).forEach((label) => {
      const pill = document.createElement("span"); pill.className = "label-pill"; pill.textContent = label; labels.appendChild(pill);
    });

    const foot = document.createElement("div");
    foot.className = "card-foot";
    const status = document.createElement("span");
    status.className = "card-status";
    status.innerHTML = `<i></i><span>${statusText(task)}</span>`;
    const grip = document.createElement("span");
    grip.className = "drag-grip";
    grip.title = "拖动排序";
    grip.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="1.4"/><circle cx="15" cy="6" r="1.4"/><circle cx="9" cy="12" r="1.4"/><circle cx="15" cy="12" r="1.4"/><circle cx="9" cy="18" r="1.4"/><circle cx="15" cy="18" r="1.4"/></svg>';
    foot.append(status, grip);
    card.append(top, main, meta);
    if (labels.children.length) card.appendChild(labels);
    card.appendChild(foot);
    if (task._justToggled) { card.classList.add("flash"); task._justToggled = false; }
    return card;
  }
  function renderSections(data, animate) {
    const content = $("content");
    content.innerHTML = "";
    const tasks = Array.isArray(data.tasks) ? data.tasks : [];
    const visible = applyFilters(tasks);
    renderSessionBar(data, visible);
    if (tasks.length > 0 && visible.length === 0) {
      const empty = document.createElement("div");
      empty.className = "no-results";
      empty.textContent = "没有匹配的任务";
      content.appendChild(empty);
      return;
    }
    if (tasks.length === 0) {
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.innerHTML = '<div class="empty-inner"><h3>还没有任务</h3><p>在上方输入一条任务，或者在对话里生成计划。</p><button id="emptyAdd" type="button">添加第一条任务</button></div>';
      const add = empty.querySelector("#emptyAdd");
      if (add) add.addEventListener("click", () => $("newTask").focus());
      content.appendChild(empty);
      return;
    }
    const groups = new Map();
    visible.forEach((task) => {
      const key = sessionKey(task.sessionId);
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(task);
    });
    const plans = data.lastPlans && typeof data.lastPlans === "object" ? data.lastPlans : {};
    const ordered = Array.from(groups.entries()).sort((a, b) => {
      const ta = a[0] !== "unassigned" && plans[a[0]] && plans[a[0]].updatedAt ? plans[a[0]].updatedAt : 0;
      const tb = b[0] !== "unassigned" && plans[b[0]] && plans[b[0]].updatedAt ? plans[b[0]].updatedAt : 0;
      if (ta !== tb) return tb - ta;
      return sessionLabel(a[0] === "unassigned" ? null : a[0], data).localeCompare(sessionLabel(b[0] === "unassigned" ? null : b[0], data), "zh-CN");
    });
    ordered.filter(([key]) => state.sessionFilter === "all" || state.sessionFilter === key).forEach(([key, items]) => {
      const record = key !== "unassigned" ? plans[key] : null;
      const time = record && record.updatedAt ? new Date(record.updatedAt).toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit" }) : "";
      const section = sectionNode(sessionLabel(key === "unassigned" ? null : key, data), items.length, time, animate);
      const grid = document.createElement("div");
      grid.className = "card-grid";
      items.forEach((task, index) => grid.appendChild(cardNode(task, index, task.source === "plan" ? "plan" : "manual", animate)));
      section.appendChild(grid);
      content.appendChild(section);
    });
  }
  function render(data, animate) {
    state.data = data;
    state.revision = Number(data.revision) || 0;
    state.demo = Boolean(data.demo);
    setMode(data.config && data.config.mode ? data.config.mode : "local");
    renderBanner();
    renderProjects(data);
    renderStats(data.stats || { total: 0, completed: 0, active: 0, percent: 0 });
    renderPlanHint(data);
    renderSections(data, Boolean(animate || state.firstRender));
    state.firstRender = false;
  }
  async function load(animate = false) {
    if (!state.connected) return;
    try {
      const result = await bridge.callTool("todoist_board_data", {});
      const data = unwrap(result);
      if (!data) throw new Error("读取失败");
      render(data, Boolean(animate));
    } catch (error) { toast(error instanceof Error ? error.message : "读取失败", "error"); }
  }
  async function checkRevision() {
    if (!state.connected || document.hidden) return;
    try {
      const result = await bridge.callTool("todoist_board_version", {});
      const data = unwrap(result);
      if (data && Number(data.version) !== state.revision) await load(true);
    } catch {}
  }
  async function toggleTask(task) {
    if (state.busy) return;
    const previous = task.checked;
    task.checked = !previous;
    task._justToggled = true;
    render(state.data, false);
    try {
      const result = await bridge.callTool(previous ? "todoist_reopen_task" : "todoist_complete_task", { task_id: task.id });
      const data = unwrap(result);
      if (data && data.ok === false) throw new Error(data.error || "操作失败");
      await load(true);
    } catch (error) {
      task.checked = previous; render(state.data, false);
      toast(error instanceof Error ? error.message : "操作失败", "error");
    }
  }
  async function reorderTasks(sourceId, targetId) {
    if (!state.data || !Array.isArray(state.data.tasks)) return;
    const tasks = state.data.tasks.slice();
    const from = tasks.findIndex((task) => String(task.id) === sourceId);
    const to = tasks.findIndex((task) => String(task.id) === targetId);
    if (from < 0 || to < 0 || from === to) return;
    const [moved] = tasks.splice(from, 1);
    tasks.splice(to, 0, moved);
    try {
      const result = await bridge.callTool("todoist_reorder_tasks", { task_ids: tasks.map((task) => task.id) });
      const data = unwrap(result);
      if (data && data.ok === false) throw new Error(data.error || "排序失败");
      await load(true);
    } catch (error) { toast(error instanceof Error ? error.message : "排序失败", "error"); }
  }
  function setPriority(value) {
    document.querySelectorAll("#priorityGroup button").forEach((button) => button.classList.toggle("active", Number(button.dataset.priority) === value));
  }
  function openEditor(task) {
    editingTask = task;
    $("editContent").value = task.content || "";
    $("editDue").value = task.dueDate || task.due || "";
    const projects = state.data && Array.isArray(state.data.projects) ? state.data.projects : [];
    $("editProject").innerHTML = "";
    projects.forEach((project) => {
      const option = document.createElement("option");
      option.value = project.id; option.textContent = project.name;
      if (String(project.id) === String(task.projectId)) option.selected = true;
      $("editProject").appendChild(option);
    });
    $("editLabels").value = (task.labels || []).join(", ");
    const priority = Number(task.priority);
    setPriority(priority >= 1 && priority <= 4 ? priority : 4);
    $("deleteConfirm").classList.add("hidden");
    $("modalBackdrop").classList.add("is-open");
    $("modal").classList.add("is-open");
    setTimeout(() => { $("editContent").focus(); $("editContent").select(); }, 80);
  }
  function closeEditor() { $("modalBackdrop").classList.remove("is-open"); $("modal").classList.remove("is-open"); editingTask = null; }
  async function saveEditor() {
    if (!editingTask) return;
    const content = $("editContent").value.trim();
    if (!content) { toast("任务内容不能为空", "error"); return; }
    const id = editingTask.id;
    $("saveBtn").disabled = true;
    try {
      const labels = $("editLabels").value.split(",").map((label) => label.trim()).filter(Boolean);
      const result = await bridge.callTool("todoist_update_task", {
        task_id: id, content, due_date: $("editDue").value,
        priority: Number(document.querySelector("#priorityGroup button.active")?.dataset.priority) || 4,
        labels, project_id: $("editProject").value || undefined,
      });
      const data = unwrap(result);
      if (data && data.ok === false) throw new Error(data.error || "保存失败");
      closeEditor(); toast("已保存"); await load(true);
    } catch (error) { toast(error instanceof Error ? error.message : "保存失败", "error"); }
    finally { $("saveBtn").disabled = false; }
  }
  async function confirmDelete() {
    if (!editingTask) return;
    const id = editingTask.id;
    $("confirmDelete").disabled = true;
    try {
      const result = await bridge.callTool("todoist_delete_task", { task_id: id });
      const data = unwrap(result);
      if (data && data.ok === false) throw new Error(data.error || "删除失败");
      closeEditor(); toast("已删除"); await load(true);
    } catch (error) { toast(error instanceof Error ? error.message : "删除失败", "error"); }
    finally { $("confirmDelete").disabled = false; }
  }
  async function addTask() {
    const input = $("newTask");
    const content = input.value.trim();
    if (!content || state.busy) return;
    state.busy = true; $("addBtn").disabled = true;
    try {
      const result = await bridge.callTool("todoist_add_task", { content });
      const data = unwrap(result);
      if (data && data.ok === false) throw new Error(data.error || "添加失败");
      input.value = ""; toast("已添加"); await load(true);
    } catch (error) { toast(error instanceof Error ? error.message : "添加失败", "error"); }
    finally { state.busy = false; $("addBtn").disabled = false; input.focus(); }
  }
  async function syncPlan() {
    if (state.busy) return;
    state.busy = true; $("syncPlanBtn").disabled = true;
    try {
      const result = await bridge.callTool("todoist_sync_last_plan", {});
      const data = unwrap(result);
      if (data && data.ok === false) throw new Error(data.error || "同步失败");
      toast(`已同步：新建 ${data.created || 0}，完成 ${data.completed || 0}`); await load(true);
    } catch (error) { toast(error instanceof Error ? error.message : "同步失败", "error"); }
    finally { state.busy = false; $("syncPlanBtn").disabled = false; }
  }
  async function createProject() {
    const name = $("projectName").value.trim();
    if (!name) return;
    $("projectCreate").disabled = true;
    try {
      const result = await bridge.callTool("todoist_create_project", { name });
      const data = unwrap(result);
      if (data && data.ok === false) throw new Error(data.error || "创建失败");
      $("projectName").value = ""; $("projectPopover").classList.add("hidden"); toast("项目已创建"); await load(true);
    } catch (error) { toast(error instanceof Error ? error.message : "创建失败", "error"); }
    finally { $("projectCreate").disabled = false; }
  }
  async function setProject(projectId) {
    try {
      const result = await bridge.callTool("todoist_set_project", { project_id: projectId });
      const data = unwrap(result);
      if (data && data.ok === false) throw new Error(data.error || "切换失败");
      await load(true);
    } catch (error) { toast(error instanceof Error ? error.message : "切换失败", "error"); }
  }
  function demoData() {
    return {
      demo: true, revision: 3, activeProjectId: "demo-project",
      projects: [{ id: "demo-project", name: "Flow 任务", isInbox: false }],
      tasks: [
        { id: "demo-1", content: "梳理 Todoist 同步规则", checked: true, source: "plan", planStatus: "completed", sessionId: "demo", projectId: "demo-project", labels: ["同步"], due: "", dueDate: "", priority: 4, order: 1 },
        { id: "demo-2", content: "把 Codex 计划步骤自动建成任务", checked: true, source: "plan", planStatus: "completed", sessionId: "demo", projectId: "demo-project", labels: ["同步"], due: "", dueDate: "", priority: 4, order: 2 },
        { id: "demo-3", content: "在侧边栏展示完成进度", checked: false, source: "plan", planStatus: "inProgress", sessionId: "demo", projectId: "demo-project", labels: ["界面"], due: "今天", dueDate: new Date().toISOString().slice(0,10), priority: 2, order: 3 },
        { id: "demo-4", content: "补上 Token 配置和错误提示", checked: false, source: "manual", planStatus: "pending", sessionId: "demo", projectId: "demo-project", labels: ["配置"], due: "", dueDate: "", priority: 3, order: 4 },
        { id: "demo-5", content: "验证真实 Todoist 账号读写", checked: false, source: "manual", planStatus: "pending", sessionId: "demo", projectId: "demo-project", labels: [], due: "", dueDate: "", priority: 4, order: 5 }
      ],
      stats: { total: 5, completed: 2, active: 3, percent: 40 },
      lastPlans: { demo: { steps: [{ step: "梳理 Todoist 同步规则", status: "completed" }, { step: "把 Codex 计划步骤自动建成任务", status: "completed" }, { step: "在侧边栏展示完成进度", status: "pending" }], updatedAt: Date.now() } },
      sessionLabels: { demo: "Todoist 面板重设计" },
      lastPlan: { sessionId: "demo", steps: [{ step: "梳理 Todoist 同步规则", status: "completed" }], updatedAt: Date.now() },
      config: { mode: "local" }
    };
  }
  async function boot() {
    try {
      await bridge.connect();
      state.connected = true;
      await load();
      connectLive();
    } catch {
      state.demo = true;
      setMode("local");
      render(demoData(), true);
    }
    state.refreshTimer = setInterval(() => { if (!document.hidden && state.connected) load(true); }, 30000);
    state.revisionTimer = setInterval(() => { if (!document.hidden) checkRevision(); }, 1500);
  }
  $("refreshBtn").addEventListener("click", () => load(true));
  $("addBtn").addEventListener("click", addTask);
  $("newTask").addEventListener("keydown", (event) => { if (event.key === "Enter") addTask(); });
  $("searchInput").addEventListener("input", (event) => { state.query = event.target.value; if (state.data) renderSections(state.data, false); });
  $("sessionBar").addEventListener("click", (event) => {
    const chip = event.target.closest("[data-session]"); if (!chip) return;
    state.sessionFilter = chip.dataset.session;
    if (state.data) renderSections(state.data, false);
  });
  $("syncPlanBtn").addEventListener("click", syncPlan);
  $("projectSelect").addEventListener("change", (event) => setProject(event.target.value));
  $("newProjectBtn").addEventListener("click", () => { $("projectPopover").classList.toggle("hidden"); if (!$("projectPopover").classList.contains("hidden")) setTimeout(() => $("projectName").focus(), 40); });
  $("projectCreate").addEventListener("click", createProject);
  $("projectName").addEventListener("keydown", (event) => { if (event.key === "Enter") createProject(); });
  $("modalBackdrop").addEventListener("click", closeEditor);
  $("modalClose").addEventListener("click", closeEditor);
  $("saveBtn").addEventListener("click", saveEditor);
  $("deleteBtn").addEventListener("click", () => $("deleteConfirm").classList.toggle("hidden"));
  $("cancelDelete").addEventListener("click", () => $("deleteConfirm").classList.add("hidden"));
  $("confirmDelete").addEventListener("click", confirmDelete);
  document.querySelectorAll("#priorityGroup button").forEach((button) => button.addEventListener("click", () => setPriority(Number(button.dataset.priority))));
  document.addEventListener("keydown", (event) => { if (event.key === "Escape") closeEditor(); });
  document.addEventListener("click", (event) => { if (!event.target.closest(".project-row")) $("projectPopover").classList.add("hidden"); });
  window.addEventListener("pointermove", (event) => {
    document.documentElement.style.setProperty("--mx", event.clientX + "px");
    document.documentElement.style.setProperty("--my", event.clientY + "px");
  }, { passive: true });
  boot();
})();
</script>
</body>
</html>
