<!doctype html>
<html lang="zh-CN">

<title>Todoist · Natural Liquid Light</title>
<style>
  :root {
    color-scheme: light dark;
    --hue: 214; --mx: 18%; --my: 8%;
    --bg: #f3f6fb; --bg-2: #e9eff7;
    --ink: #121418; --muted: #6b7480; --faint: #8d98a5;
    --glass: rgba(255,255,255,.34); --glass-strong: rgba(255,255,255,.62);
    --card: rgba(255,255,255,.42);
    --line: rgba(18,20,24,.09); --rim: rgba(255,255,255,.62);

    --card: rgba(28,29,33,.72);
    --line: rgba(255,255,255,.10); --rim: rgba(255,255,255,.12);
    --accent: hsl(var(--hue), 72%, 62%); --accent-soft: hsl(var(--hue) 72% 62% / .16);
    --shadow: 0 30px 90px rgba(0,0,0,.42);
    --shadow-card: 0 24px 65px rgba(0,0,0,.36), inset 0 1px 0 rgba(255,255,255,.14), inset 1px 0 0 rgba(255,255,255,.08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1012; --bg-2: #121316;
      --ink: #f7f8fa; --muted: #a8b0bb; --faint: #727c88;
      --glass: rgba(28,29,33,.64); --glass-strong: rgba(37,39,46,.84);
      --card: rgba(28,29,33,.72);
      --line: rgba(255,255,255,.10); --rim: rgba(255,255,255,.12);
      --accent: hsl(var(--hue), 72%, 62%); --accent-soft: hsl(var(--hue) 72% 62% / .16);
      --shadow: 0 30px 90px rgba(0,0,0,.42);
      --shadow-card: 0 24px 65px rgba(0,0,0,.36), inset 0 1px 0 rgba(255,255,255,.14), inset 1px 0 0 rgba(255,255,255,.08);
    }
  }
  html.light {
    --bg: #f3f6fb; --bg-2: #e9eff7;
    --ink: #121418; --muted: #6b7480; --faint: #8d98a5;
    --glass: rgba(255,255,255,.34); --glass-strong: rgba(255,255,255,.62);
    --card: rgba(255,255,255,.42);
    --line: rgba(18,20,24,.09); --rim: rgba(255,255,255,.62);
    --accent: hsl(var(--hue), 82%, 54%); --accent-soft: hsl(var(--hue) 82% 54% / .15);
    --shadow: 0 28px 80px rgba(52,73,110,.13);
    --shadow-card: 0 18px 48px rgba(52,73,110,.12), inset 0 1px 0 rgba(255,255,255,.72), inset 1px 0 0 rgba(255,255,255,.32);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { min-height: 100%; }

      linear-gradient(145deg, var(--bg), var(--bg-2));

    background-size: 4px 4px; mix-blend-mode: multiply;
  }
  html.dark body::before { opacity: .09; mix-blend-mode: screen; }
  button, input, select { font: inherit; color: inherit; }
  button { border: 0; background: none; padding: 0; cursor: pointer; }
  .glass, .glass-strong {
    border: 1px solid var(--line);
    -webkit-backdrop-filter: blur(48px) saturate(1.25);
    backdrop-filter: blur(48px) saturate(1.25);

  }
  .glass { background: var(--glass); }

  .cloud-copy small { display: block; margin-top: 2px; color: rgba(255,255,255,.62); font-size: 10.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .cloud-mode i { width: 5px; height: 5px; border-radius: 50%; background: #f2ad4b; }
  .cloud-mode.live i { background: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); animation: breath 2.4s ease-in-out infinite; }
  .cloud-progress { width: 100px; flex: 0 0 auto; }
  .cloud-progress .pct { display: flex; align-items: baseline; justify-content: space-between; color: rgba(255,255,255,.58); font-size: 9px; }
  .cloud-progress .pct b { color: #fff; font-size: 16px; letter-spacing: -.04em; }
  .cloud-track { height: 5px; margin-top: 7px; overflow: hidden; border-radius: 999px; background: rgba(255,255,255,.14); }
  .cloud-track i { display: block; width: 0%; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--accent), hsl(var(--hue) 95% 75%)); transition: width .8s var(--spring); }
  .icon-button {
    width: 38px; height: 38px; flex: 0 0 auto; display: grid; place-items: center; color: var(--muted);
    border: 1px solid var(--line); border-radius: 14px; background: rgba(127,127,127,.05);
    transition: background .25s ease, color .25s ease, transform .4s var(--spring);
  }
  .icon-button:hover { color: var(--ink); background: rgba(127,127,127,.13); }
  .icon-button:active { transform: scale(.92); }
  .icon-button svg { width: 17px; height: 17px; }
  .workspace { display: grid; grid-template-columns: 232px minmax(0,1fr); gap: 20px; margin-top: 20px; }
  .session-panel { align-self: start; position: sticky; top: 100px; padding: 16px; border-radius: var(--radius-xl); }
  .panel-label { display: block; margin-bottom: 11px; color: var(--faint); font-size: 10px; font-weight: 650; letter-spacing: .17em; text-transform: uppercase; }
  .session-list { display: grid; gap: 6px; }
  .session-button {
    display: flex; align-items: center; gap: 9px; width: 100%; min-height: 46px; padding: 8px 10px;
    border-radius: var(--radius-md); color: var(--muted); text-align: left;
    transition: background .28s ease, color .28s ease, transform .4s var(--spring);
  }
  .session-button:hover { background: rgba(127,127,127,.10); color: var(--ink); }
  .session-button:active { transform: scale(.97); }
  .session-button.active { color: var(--bg); background: var(--ink); box-shadow: 0 10px 25px rgba(0,0,0,.12); }
  .session-orb { width: 9px; height: 9px; flex: 0 0 auto; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }

  .session-count { color: var(--faint); font-size: 10px; font-variant-numeric: tabular-nums; }
  .session-button.active .session-count { color: rgba(255,255,255,.6); }
  .main-panel { min-width: 0; display: flex; flex-direction: column; gap: 18px; }
  .control-bar { display: grid; gap: 13px; padding: 16px 17px; border-radius: var(--radius-xl); }
  .project-row { display: flex; align-items: center; gap: 8px; position: relative; }
  .project-select { flex: 1; min-width: 0; height: 42px; padding: 0 36px 0 12px; border: 1px solid var(--line); border-radius: 13px; outline: 0; background: rgba(127,127,127,.045); color: var(--ink); font-size: 13px; -webkit-appearance: none; appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 17px) 18px, calc(100% - 12px) 18px; background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; }
  .project-select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .popover { position: absolute; top: 48px; left: 0; right: 44px; z-index: 30; display: flex; gap: 6px; padding: 8px; border: 1px solid var(--line); border-radius: 15px; background: var(--glass-strong); box-shadow: var(--shadow); -webkit-backdrop-filter: blur(28px); backdrop-filter: blur(28px); }
  .popover input { flex: 1; min-width: 0; height: 34px; padding: 0 10px; border: 1px solid var(--line); border-radius: 10px; background: rgba(127,127,127,.06); color: var(--ink); outline: 0; font-size: 12px; }
  .popover input:focus { border-color: var(--accent); }
  .popover button { height: 34px; padding: 0 12px; border-radius: 10px; background: var(--ink); color: var(--bg); font-size: 12px; font-weight: 600; }
  .search-row { display: flex; align-items: center; gap: 9px; height: 44px; padding: 0 13px; border: 1px solid var(--line); border-radius: var(--radius-md); background: rgba(127,127,127,.055); }
  .search-row:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .search-row svg { width: 17px; height: 17px; flex: 0 0 auto; color: var(--faint); }
  .search-row input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-size: 14px; }
  input::placeholder { color: var(--faint); }
  .quick-row { display: flex; align-items: center; gap: 9px; }
  .quick-add { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; min-height: 48px; padding: 4px 5px 4px 14px; border: 1px solid var(--line); border-radius: var(--radius-md); background: rgba(127,127,127,.045); }
  .quick-add:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .quick-add input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-size: 14px; }
  .primary-add { width: 40px; height: 40px; flex: 0 0 auto; display: grid; place-items: center; border-radius: 14px; color: var(--bg); background: var(--ink); transition: transform .4s var(--spring), opacity .2s; }
  .primary-add:hover { opacity: .84; }
  .primary-add:active { transform: scale(.9) rotate(7deg); }
  .primary-add svg { width: 17px; height: 17px; }
  .secondary-button { height: 40px; padding: 0 13px; border: 1px solid var(--line); border-radius: 13px; color: var(--muted); background: rgba(127,127,127,.05); font-size: 11px; white-space: nowrap; transition: background .25s ease, color .25s ease, transform .35s var(--spring); }
  .secondary-button:hover { color: var(--ink); background: rgba(127,127,127,.13); }
  .secondary-button:active { transform: scale(.95); }
  .secondary-button:disabled { opacity: .36; cursor: default; }
  .hint { min-height: 15px; color: var(--faint); font-size: 10.5px; }
  .banner { display: flex; align-items: flex-start; gap: 9px; padding: 11px 13px; border: 1px solid var(--line); border-radius: var(--radius-md); color: var(--muted); background: rgba(127,127,127,.055); font-size: 11.5px; }
  .banner svg { flex: 0 0 auto; width: 15px; height: 15px; margin-top: 1px; color: var(--accent); }  .content { display: grid; gap: 22px; }
  .session-group { animation: groupIn .48s var(--spring) both; }
  .session-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; min-width: 0; }
  .session-head h2 { margin: 0; max-width: min(72%, 560px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 18px; line-height: 1.3; font-weight: 500; letter-spacing: -.025em; }
  .session-total { color: var(--faint); font-size: 11px; font-variant-numeric: tabular-nums; }
  .session-time { color: var(--faint); font-size: 10.5px; }
  .session-rule { flex: 1; height: 1px; background: var(--line); }
  .card-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; align-items: stretch; }
  .task-card {
    --lx: 50%; --ly: 0%;
    position: relative; min-height: 178px; overflow: hidden; display: flex; flex-direction: column; gap: 12px;
    padding: 17px 17px 14px; border: 1px solid var(--line); border-radius: var(--radius-xl);
    background: var(--card); box-shadow: var(--shadow-card);
    -webkit-backdrop-filter: blur(42px) saturate(1.25); backdrop-filter: blur(42px) saturate(1.25);
    transition: transform .5s var(--spring), border-color .3s ease, box-shadow .5s ease, opacity .3s ease;
  }
  .task-card::before {
    content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0;
    background: radial-gradient(260px circle at var(--lx) var(--ly), rgba(255,255,255,.46), transparent 58%);
    mix-blend-mode: soft-light; transition: opacity .3s ease;
  }
  .task-card::after {
    content: ""; position: absolute; left: 17px; right: 17px; top: 0; height: 2px;
    background: linear-gradient(90deg, var(--accent), hsl(var(--hue) 95% 72%), transparent); opacity: .75;
  }
  .task-card:hover { transform: translateY(-4px) rotateX(1.1deg); border-color: var(--line); box-shadow: 0 26px 70px rgba(50,75,120,.20), inset 0 1px 0 rgba(255,255,255,.74); }
  .task-card:hover::before { opacity: 1; }
  .task-card.completed { opacity: .72; background: rgba(127,127,127,.09); box-shadow: none; }
  .task-card.completed::after { background: linear-gradient(90deg, var(--faint), transparent); }
  .card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; position: relative; z-index: 1; }
  .card-kind { color: var(--faint); font-size: 10px; font-weight: 650; letter-spacing: .14em; text-transform: uppercase; font-variant-numeric: tabular-nums; }
  .card-more { width: 27px; height: 27px; display: grid; place-items: center; border-radius: 9px; color: var(--faint); opacity: .6; transition: opacity .2s, background .2s, color .2s; }
  .task-card:hover .card-more, .card-more:focus-visible { opacity: 1; }
  .card-more:hover { color: var(--ink); background: rgba(127,127,127,.12); }
  .card-more svg { width: 15px; height: 15px; }
  .card-main { display: flex; align-items: flex-start; gap: 10px; position: relative; z-index: 1; }
  .task-toggle { width: 27px; height: 27px; flex: 0 0 auto; display: grid; place-items: center; border-radius: 9px; border: 1.5px solid var(--line); color: transparent; background: rgba(127,127,127,.04); transition: transform .4s var(--spring), color .2s, border-color .2s, background .2s; }
  .task-toggle:hover { border-color: var(--accent); }
  .task-toggle:active { transform: scale(.82) rotate(-5deg); }
  .task-toggle svg { width: 13px; height: 13px; stroke-width: 2.8; }
  .task-card.completed .task-toggle { color: #fff; border-color: var(--accent); background: var(--accent); }
  .task-title { margin: 0; min-width: 0; font-size: 15px; line-height: 1.45; font-weight: 500; letter-spacing: -.015em; word-break: break-word; cursor: text; }
  .task-card.completed .task-title { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 1px; }
  .task-meta { display: flex; align-items: center; gap: 5px 7px; flex-wrap: wrap; color: var(--muted); font-size: 11px; position: relative; z-index: 1; }
  .meta-dot { width: 3px; height: 3px; border-radius: 50%; background: var(--faint); }
  .label-row { display: flex; flex-wrap: wrap; gap: 5px; position: relative; z-index: 1; }
  .label-pill { padding: 2px 7px; border-radius: 7px; background: var(--accent-soft); color: var(--accent); font-size: 10px; }
  .card-foot { margin-top: auto; display: flex; align-items: center; justify-content: space-between; gap: 8px; color: var(--faint); font-size: 10px; position: relative; z-index: 1; }
  .status { display: inline-flex; align-items: center; gap: 5px; }

  .task-card.active .status i { background: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
  .task-card.completed .status i { background: var(--ink); }

  .task-card:hover .drag-grip { opacity: .8; }

  .empty, .no-results { min-height: 300px; display: flex; align-items: center; justify-content: center; text-align: center; color: var(--muted); }
  .empty-inner { max-width: 360px; padding: 32px; border: 1px dashed var(--line); border-radius: var(--radius-xl); background: rgba(127,127,127,.035); }
  .empty h3 { margin: 0 0 6px; color: var(--ink); font-size: 18px; font-weight: 500; }
  .empty p { margin: 0; font-size: 12px; }
  .empty button { margin-top: 16px; height: 42px; padding: 0 16px; border-radius: 14px; color: var(--bg); background: var(--ink); font-size: 12px; }

  .modal-backdrop.open { opacity: 1; visibility: visible; }

  .sheet.open { opacity: 1; visibility: visible; transform: translate(-50%, -50%) scale(1); }

  .sheet-close:hover { background: rgba(127,127,127,.12); color: var(--ink); }

  .field label { display: block; margin-bottom: 6px; color: var(--muted); font-size: 11px; }
  .field input, .field select { width: 100%; height: 42px; padding: 0 11px; border: 1px solid var(--line); border-radius: 13px; outline: 0; background: rgba(127,127,127,.055); color: var(--ink); font-size: 13px; }
  .field input:focus, .field select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .priority-row { display: flex; gap: 6px; }
  .priority-row button { flex: 1; height: 38px; border-radius: 11px; background: rgba(127,127,127,.08); color: var(--muted); font-size: 11px; }

  .sheet-actions { display: flex; gap: 8px; margin-top: 18px; }
  .sheet-actions button { flex: 1; height: 44px; border-radius: 13px; font-size: 12px; font-weight: 600; }
